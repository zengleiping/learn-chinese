  /* 連連看 */
  function renderMatchBoard(q, container){
    var progress = getProgress(q.id);
    var interactive = canInteract();
    var pairs = q.pairs || {};
    var pairKeys = Object.keys(pairs);
    var isTest = currentClassMode === 'test';

    // 用題目ID做固定種子洗牌：不管誰渲染、渲染幾次，右欄順序都完全一樣（老師／學生、每次重繪都一致）
    var rightOrder = seededShuffle(pairKeys, q.id + "|match-right");

    var matched = progress.matched || {};
    var userPairs = progress.userPairs || {};

    var wrap = document.createElement("div"); wrap.className = "match-board";
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "match-svg");
    wrap.appendChild(svg);

    var cols = document.createElement("div"); cols.className = "match-cols";
    var leftCol = document.createElement("div"); leftCol.className = "match-col";
    leftCol.innerHTML = `<div class="match-col-label">${q.leftLabel || "項目"}</div>`;
    var rightCol = document.createElement("div"); rightCol.className = "match-col";
    rightCol.innerHTML = `<div class="match-col-label">${q.rightLabel || "配對"}</div>`;

    // 選取狀態不限定一定要先點左欄：不論先點左邊還是右邊的項目，都會先顯示「已選取」的變色提示，
    // 接著點另一側的項目才會嘗試配對；點同一側的另一個項目則是換成新的選取。
    var selection = null; // { side: "left"|"right", pid: string }

    function clearSelectedVisual(){
      wrap.querySelectorAll(".match-item.selected").forEach(function(x){ x.classList.remove("selected"); });
    }

    function handleItemClick(side, pid, btn, locked){
      if(!interactive || locked) return;

      // 再點一次目前已選取的項目：取消選取
      if(selection && selection.side === side && selection.pid === pid){
        selection = null;
        clearSelectedVisual();
        return;
      }

      // 還沒選任何東西，或是點了同一側的另一個項目：更新為新的選取（兩側都可以是「第一次點擊」）
      if(!selection || selection.side === side){
        selection = { side: side, pid: pid };
        clearSelectedVisual();
        btn.classList.add("selected");
        return;
      }

      // 已經選了另一側的項目，這次點的是不同側 → 嘗試配對
      var leftPid = side === "left" ? pid : selection.pid;
      var rightPid = side === "right" ? pid : selection.pid;
      var leftBtn = leftCol.querySelector('[data-pid="' + leftPid + '"]');
      var rightBtn = rightCol.querySelector('[data-pid="' + rightPid + '"]');

      if(isTest){
        userPairs[leftPid] = rightPid;
        writeProgress(q.id, { userPairs: userPairs });
        selection = null;
        renderStage();
        return;
      }

      if(leftPid === rightPid){
        matched[leftPid] = true;
        playCorrectSound();
        writeProgress(q.id, { matched: matched });
        selection = null;
        renderStage();
      } else {
        if(leftBtn) leftBtn.classList.add("wrong");
        if(rightBtn) rightBtn.classList.add("wrong");
        playWrongSound();
        selection = null;
        setTimeout(function(){
          if(leftBtn) leftBtn.classList.remove("wrong", "selected");
          if(rightBtn) rightBtn.classList.remove("wrong", "selected");
        }, 450);
      }
    }

    pairKeys.forEach(function(pid){
      var p = pairs[pid];
      var btn = document.createElement("button");
      btn.type = "button"; btn.className = "match-item"; btn.dataset.side = "left"; btn.dataset.pid = pid;
      btn.textContent = p.left;
      var locked = !isTest && !!matched[pid];
      if(locked){ btn.classList.add("matched"); btn.disabled = true; }
      if(!interactive) btn.disabled = true;
      btn.onclick = function(){ handleItemClick("left", pid, btn, locked); };
      leftCol.appendChild(btn);
    });

    rightOrder.forEach(function(pid){
      var p = pairs[pid]; if(!p) return;
      var btn = document.createElement("button");
      btn.type = "button"; btn.className = "match-item"; btn.dataset.side = "right"; btn.dataset.pid = pid;
      btn.textContent = p.right;
      var rLocked = !isTest && !!matched[pid];
      if(rLocked){ btn.classList.add("matched"); btn.disabled = true; }
      if(!interactive) btn.disabled = true;
      btn.onclick = function(){ handleItemClick("right", pid, btn, rLocked); };
      rightCol.appendChild(btn);
    });

    cols.appendChild(leftCol); cols.appendChild(rightCol);
    wrap.appendChild(cols);
    container.appendChild(wrap);

    var doneCount = isTest
      ? Object.keys(userPairs).filter(function(k){ return userPairs[k]; }).length
      : Object.keys(matched).filter(function(k){ return matched[k]; }).length;
    if(pairKeys.length > 0 && doneCount === pairKeys.length){
      var note = document.createElement("p");
      note.style.cssText = "font-size:13px;color:var(--bamboo);margin-top:14px;font-weight:700;text-align:center;";
      note.textContent = isTest ? "✅ 已完成全部配對，可點擊「結算成績」查看結果。" : "🎉 太棒了！全部配對完成！";
      wrap.appendChild(note);
    }

    function drawLines(){
      svg.innerHTML = "";
      var wrapRect = wrap.getBoundingClientRect();
      var w = wrapRect.width, h = wrapRect.height;
      if(!w || !h) return;
      svg.setAttribute("viewBox", "0 0 " + w + " " + h);
      var sourceMap = isTest ? userPairs : matched;
      Object.keys(sourceMap).forEach(function(lpid){
        if(!sourceMap[lpid]) return;
        var rpid = isTest ? sourceMap[lpid] : lpid;
        var leftEl = leftCol.querySelector('[data-pid="' + lpid + '"]');
        var rightEl = rightCol.querySelector('[data-pid="' + rpid + '"]');
        if(!leftEl || !rightEl) return;
        var lr = leftEl.getBoundingClientRect(), rr = rightEl.getBoundingClientRect();
        var x1 = lr.right - wrapRect.left, y1 = lr.top - wrapRect.top + lr.height / 2;
        var x2 = rr.left - wrapRect.left, y2 = rr.top - wrapRect.top + rr.height / 2;
        var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1); line.setAttribute("y1", y1);
        line.setAttribute("x2", x2); line.setAttribute("y2", y2);
        line.setAttribute("stroke", isTest ? "var(--seal)" : "var(--bamboo)");
        line.setAttribute("stroke-width", "2.5");
        line.setAttribute("stroke-linecap", "round");
        svg.appendChild(line);
      });
    }
    requestAnimationFrame(drawLines);
    window.addEventListener("resize", drawLines);
  }

  /* 選擇題（支援複選） */
  function renderChoiceBoard(q, container){
    var progress = getProgress(q.id);
    var interactive = canInteract();
    var multiPicks = progress.multiPicks || {};
    var isTest = currentClassMode === 'test';
    var correctIds = q.answerIds || (q.answerId ? [q.answerId] : []);

    var wrap = document.createElement("div");
    wrap.innerHTML = `<p class="circle-prompt zh">${q.prompt || q.title}</p>`;
    var cBox = document.createElement("div"); cBox.className = "mc-choices-container";

    var keys = Object.keys(q.choices || {}).sort();
    var letters = ["A", "B", "C", "D", "E", "F"];

    keys.forEach(function(cid, idx){
      var c = q.choices[cid];
      var btn = document.createElement("button"); btn.type = "button"; btn.className = "mc-option-btn"; btn.dataset.cid = cid;

      var isPicked = !!multiPicks[cid];
      var isCorrect = correctIds.indexOf(cid) !== -1;

      // 練習模式：勾選當下立刻顯示對／錯（即時回饋，不需要交卷）
      // 測驗模式：全程只顯示「已勾選」中性樣式，正確與否要等交卷結算才公布
      if(!isTest && isPicked){
        btn.classList.add(isCorrect ? "correct" : "wrong");
      } else if(isPicked){
        btn.classList.add("selected");
      }
      if(!interactive) btn.disabled = true;

      btn.innerHTML = `
        <span class="mc-opt-prefix">${letters[idx] || (idx+1)}</span>
        <span>${c.text}</span>
      `;

      btn.onclick = function(){
        if(!interactive) return;
        multiPicks[cid] = !multiPicks[cid];
        if(multiPicks[cid] && !isTest){
          if(isCorrect) playCorrectSound(); else playWrongSound();
        }
        writeProgress(q.id, { multiPicks: multiPicks });
      };
      cBox.appendChild(btn);
    });

    wrap.appendChild(cBox);
    container.appendChild(wrap);
  }

  /* 排序題（句子重組 - 全拖曳、放上可更正、排滿兩秒自動判定） */
  function renderReorderBoard(q, container){
    var progress = getProgress(q.id);
    var interactive = canInteract();
    // 練習模式：只有在使用者實際排對之後才會標記 revealed（見 evaluateReorderState）
    // 測驗模式：全程不公布答案，要交卷結算才知道對錯
    var isRevealed = currentClassMode !== 'test' && !!progress.revealed;
    var correctWords = q.words || [];

    // 用題目ID做固定種子洗牌：不管誰渲染、渲染幾次，題目池的初始順序都完全一樣（老師／學生、每次重繪都一致）
    // 只有在真正還沒有任何已存進度（userWords/poolWords 都不存在）時才產生初始洗牌後的池，
    // 一旦有了 progress 裡的實際資料就直接使用，避免用暫存旗標判斷在房間模式下失效
    var userWords, poolWords;
    if(progress.userWords === undefined && progress.poolWords === undefined){
      userWords = [];
      poolWords = seededShuffle(correctWords, q.id + "|reorder-pool");
    } else {
      userWords = progress.userWords || [];
      poolWords = progress.poolWords || [];
    }

    var wrap = document.createElement("div");
    wrap.className = "reorder-container";
    wrap.innerHTML = `<p class="circle-prompt zh">${q.prompt || "請將下列詞語拖曳重組為正確句子："}</p>`;

    var slotZone = document.createElement("div");
    slotZone.className = "reorder-slot-zone";

    // 依拖放資料類型與來源索引，把該詞語搬到已排列區的第 targetIdx 個位置（不傳 targetIdx 代表搬到最後面）
    // 這個函式同時支援：從詞語池拖進來、以及在已排列區內拖曳既有的詞語方塊調整順序
    // → 學生排錯順序時，不需要整個重新作答，只要把方塊拖曳到正確位置即可
    function handleSlotDrop(e, targetIdx){
      e.preventDefault();
      e.stopPropagation();
      slotZone.classList.remove("drag-over-zone");
      var data = e.dataTransfer.getData("text/plain");
      if(!data) return;
      var parts = data.split(":");
      var type = parts[0];
      var srcIdx = parseInt(parts[parts.length - 1], 10);
      if(isNaN(srcIdx)) return;

      if(type === "pool"){
        if(poolWords[srcIdx] === undefined) return;
        var word = poolWords.splice(srcIdx, 1)[0];
        var insertAt = (targetIdx === undefined || targetIdx === null) ? userWords.length : targetIdx;
        userWords.splice(insertAt, 0, word);
        evaluateReorderState(q, userWords, poolWords, correctWords);
      } else if(type === "user"){
        if(userWords[srcIdx] === undefined) return;
        if(targetIdx === undefined || targetIdx === null){
          if(srcIdx === userWords.length - 1) return; // 已經在最後面，不需異動
          var wEnd = userWords.splice(srcIdx, 1)[0];
          userWords.push(wEnd);
        } else {
          if(srcIdx === targetIdx) return;
          var wMove = userWords.splice(srcIdx, 1)[0];
          var insertAt2 = (srcIdx < targetIdx) ? targetIdx - 1 : targetIdx;
          userWords.splice(insertAt2, 0, wMove);
        }
        evaluateReorderState(q, userWords, poolWords, correctWords);
      }
    }

    slotZone.ondragover = function(e){
      if(!interactive || isRevealed) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      slotZone.classList.add("drag-over-zone");
    };
    slotZone.ondragleave = function(){
      slotZone.classList.remove("drag-over-zone");
    };
    slotZone.ondrop = function(e){
      if(!interactive || isRevealed) { e.preventDefault(); return; }
      handleSlotDrop(e); // 拖放到已排列區的空白處（非特定方塊上）：搬到最後面
    };

    if(userWords.length === 0){
      slotZone.innerHTML = `<span style="font-size:14px; color:var(--ink-soft); pointer-events:none;">請將下方詞語拖曳排列到這裡...</span>`;
    } else {
      userWords.forEach(function(w, idx){
        var chip = document.createElement("div");
        chip.className = "reorder-chip" + (isRevealed ? " correct-done" : " placed");
        chip.textContent = w;
        if(!isRevealed && interactive){
          chip.setAttribute("draggable", "true");
          chip.ondragstart = function(e){
            e.dataTransfer.setData("text/plain", "user:" + w + ":" + idx);
            e.stopPropagation();
          };
          chip.ondragover = function(e){
            e.preventDefault();
            e.stopPropagation();
            e.dataTransfer.dropEffect = "move";
            chip.classList.add("drag-over-insert");
          };
          chip.ondragleave = function(){ chip.classList.remove("drag-over-insert"); };
          chip.ondrop = function(e){
            chip.classList.remove("drag-over-insert");
            handleSlotDrop(e, idx); // 拖放到某個已排列的方塊上：插入到它前面（可用來調整順序）
          };
          chip.onclick = function(){
            userWords.splice(idx, 1);
            poolWords.push(w);
            writeProgress(q.id, { userWords: userWords, poolWords: poolWords });
          };
        }
        slotZone.appendChild(chip);
      });
    }
    wrap.appendChild(slotZone);

    var poolZone = document.createElement("div");
    poolZone.style.cssText = "display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; min-height:64px; align-items:center;";
    poolZone.ondragover = function(e){
      if(!interactive || isRevealed) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
    };
    poolZone.ondrop = function(e){
      e.preventDefault();
      var data = e.dataTransfer.getData("text/plain");
      if(!data) return;
      var parts = data.split(":");
      var type = parts[0];
      var idx = parseInt(parts[2], 10);

      if(type === "user"){
        if(!isNaN(idx) && userWords[idx] !== undefined){
          var word = userWords.splice(idx, 1)[0];
          poolWords.push(word);
          writeProgress(q.id, { userWords: userWords, poolWords: poolWords });
        }
      }
    };

    poolWords.forEach(function(w, idx){
      var chip = document.createElement("div");
      chip.className = "reorder-chip";
      chip.textContent = w;
      if(isRevealed){
        chip.classList.add("correct-done");
      } else if(interactive){
        chip.setAttribute("draggable", "true");
        chip.ondragstart = function(e){
          e.dataTransfer.setData("text/plain", "pool:" + w + ":" + idx);
          e.stopPropagation();
        };
        chip.onclick = function(){
          poolWords.splice(idx, 1);
          userWords.push(w);
          evaluateReorderState(q, userWords, poolWords, correctWords);
        };
      }
      poolZone.appendChild(chip);
    });
    wrap.appendChild(poolZone);

    if(isRevealed){
      var note = document.createElement("p");
      note.style.fontSize = "13px"; note.style.color = "var(--bamboo)"; note.style.marginTop = "10px"; note.style.fontWeight = "700";
      note.textContent = "🎉 答對了！正確解答： " + correctWords.join(" ");
      wrap.appendChild(note);
    }

    container.appendChild(wrap);
  }

  var reorderTimer = null;
  function evaluateReorderState(q, userWords, poolWords, correctWords){
    if(reorderTimer) clearTimeout(reorderTimer);

    if(userWords.length === correctWords.length){
      writeProgress(q.id, { userWords: userWords, poolWords: poolWords });

      reorderTimer = setTimeout(function(){
        var isMatch = userWords.every(function(val, i){ return val === correctWords[i]; });
        if(currentClassMode === 'test'){
          writeProgress(q.id, { userWords: userWords, poolWords: poolWords });
        } else {
          if(isMatch){
            playCorrectSound();
            writeProgress(q.id, { revealed: true });
          } else {
            playWrongSound();
            // 答錯不清空已排列的詞語：只做搖晃提示，讓學生可以直接拖曳方塊調整順序，
            // 不需要整個重新作答（把詞語一個個點回詞語池再重排）
            var slotZone = document.querySelector(".reorder-slot-zone");
            if(slotZone){
              var wrongChips = slotZone.querySelectorAll(".reorder-chip");
              wrongChips.forEach(function(el){ el.classList.add("wrong-shake"); });
              setTimeout(function(){
                wrongChips.forEach(function(el){ el.classList.remove("wrong-shake"); });
              }, 550);
            }
          }
        }
      }, 750);
    } else {
      writeProgress(q.id, { userWords: userWords, poolWords: poolWords });
    }
  }

  /* ================== 寫字板工具狀態 ================== */
  var boardState = { tool: "pen", color: "#B23B32", size: 6, fontSize: 36 };
  var boardResizeHandler = null; // 記住上一次掛的 resize 監聽器，每次重繪寫字板前先移除，避免每畫一筆就累積一個監聽器

  /* ================== 寫字板功能 (完整恢復) ================== */
  function renderDrawBoard(q, container){
    var progress = getProgress(q.id);
    var strokes = progress.strokes || [];
    var texts = progress.texts || [];
    var currentGrid = progress.gridType || q.gridType || "jiu";
    var currentBg = progress.bgImage || q.bgImage || "";

    var layout = document.createElement("div"); layout.className = "draw-board-layout";

    var vToolbar = document.createElement("div"); vToolbar.className = "draw-toolbar-vertical";
    // 顏色選項共用內容：畫筆／打字兩個工具各自 hover 才浮現一份，選色會同步套用到 boardState.color
    var colorDotsHtml = `
        <div class="color-dot ${boardState.color==='#B23B32'?'active':''}" data-color="#B23B32" style="background:#B23B32;" title="紅色"></div>
        <div class="color-dot dark-color-dot ${(boardState.color==='#2A333C'||boardState.color==='#E5EAE6'||boardState.color==='#FFFFFF')?'active':''}" data-color="#2A333C" style="background:#2A333C;" title="黑/白"></div>
        <div class="color-dot ${boardState.color==='#1E88E5'?'active':''}" data-color="#1E88E5" style="background:#1E88E5;" title="藍色"></div>
        <div class="color-dot ${boardState.color==='#4C7A5E'?'active':''}" data-color="#4C7A5E" style="background:#4C7A5E;" title="綠色"></div>
        <div class="color-dot ${boardState.color==='#FB8C00'?'active':''}" data-color="#FB8C00" style="background:#FB8C00;" title="橘色"></div>`;

    vToolbar.innerHTML = `
      <div class="tool-btn-v-wrap">
        <button type="button" class="tool-btn-v ${boardState.tool==='pen'?'active':''}" data-tool="pen" title="畫筆（滑鼠移入可選顏色）"><span class="tool-btn-v-icon">✏️</span><span class="tool-btn-v-label">畫筆</span></button>
        <div class="color-popover"><div class="color-popover-title">筆刷顏色</div><div class="color-dot-grid">${colorDotsHtml}</div></div>
      </div>
      <div class="tool-btn-v-wrap">
        <button type="button" class="tool-btn-v ${boardState.tool==='text'?'active':''}" data-tool="text" title="打字（滑鼠移入可選顏色）"><span class="tool-btn-v-icon">🔤</span><span class="tool-btn-v-label">打字</span></button>
        <div class="color-popover"><div class="color-popover-title">文字顏色</div><div class="color-dot-grid">${colorDotsHtml}</div></div>
      </div>
      <button type="button" class="tool-btn-v ${boardState.tool==='stroke-eraser'?'active':''}" data-tool="stroke-eraser" title="筆畫整條擦除"><span class="tool-btn-v-icon">🪄</span><span class="tool-btn-v-label">筆畫擦</span></button>
      <button type="button" class="tool-btn-v ${boardState.tool==='pixel-eraser'?'active':''}" data-tool="pixel-eraser" title="局部橡皮擦"><span class="tool-btn-v-icon">🧽</span><span class="tool-btn-v-label">局部擦</span></button>
      <div class="tool-v-sep"></div>
      <div class="grid-btn-group">
        <button type="button" class="grid-btn-v ${currentGrid==='none'?'active':''}" data-grid="none" title="無格">無</button>
        <button type="button" class="grid-btn-v ${currentGrid==='tian'?'active':''}" data-grid="tian" title="田字格">田</button>
        <button type="button" class="grid-btn-v ${currentGrid==='jiu'?'active':''}" data-grid="jiu" title="九宮格">九</button>
      </div>
      <div class="tool-v-sep"></div>
      <div class="size-btn-group">
        <button type="button" class="size-btn-v ${boardState.size===3?'active':''}" data-size="3">細</button>
        <button type="button" class="size-btn-v ${boardState.size===6?'active':''}" data-size="6">中</button>
        <button type="button" class="size-btn-v ${boardState.size===12?'active':''}" data-size="12">粗</button>
      </div>
      <div class="tool-v-sep"></div>
      <select class="board-font-select" style="width:100%; padding:6px 0; font-size:12.5px; font-weight:700; text-align:center; background:var(--surface); border-radius:8px; border:1.5px solid rgba(28,33,30,0.14);">
        <option value="24" ${boardState.fontSize===24?'selected':''}>24</option>
        <option value="32" ${boardState.fontSize===32?'selected':''}>32</option>
        <option value="40" ${boardState.fontSize===40?'selected':''}>40</option>
        <option value="52" ${boardState.fontSize===52?'selected':''}>52</option>
        <option value="68" ${boardState.fontSize===68?'selected':''}>68</option>
        <option value="84" ${boardState.fontSize===84?'selected':''}>84</option>
      </select>
      <div class="tool-v-sep"></div>
      <button type="button" class="tool-btn-v" id="btn-upload-bg" title="上傳底圖"><span class="tool-btn-v-icon">📷</span><span class="tool-btn-v-label">底圖</span></button>
      <button type="button" class="tool-btn-v" id="btn-remove-bg" style="display:${currentBg ? 'flex' : 'none'}; color:#E63946;" title="清除底圖"><span class="tool-btn-v-icon">✕</span><span class="tool-btn-v-label">清底圖</span></button>
      <input type="file" id="board-bg-file" accept="image/*" style="display:none;">
      <div class="tool-v-sep"></div>
      <button type="button" class="tool-btn-v" id="btn-clear-draw" style="color:var(--seal);" title="清空畫布"><span class="tool-btn-v-icon">🗑️</span><span class="tool-btn-v-label">清空</span></button>
    `;

    layout.appendChild(vToolbar);

    var cWrap = document.createElement("div");
    cWrap.className = "canvas-stage-wrap " + (currentGrid === 'tian' ? 'grid-tian' : (currentGrid === 'jiu' ? 'grid-jiu' : ''));
    if(currentBg){
      var img = document.createElement("img"); img.className = "bg-img-layer"; img.src = currentBg;
      cWrap.appendChild(img);
    }
    var canvas = document.createElement("canvas"); canvas.id = "paint-canvas";
    var textLayer = document.createElement("div"); textLayer.className = "text-layer";
    cWrap.appendChild(canvas);
    cWrap.appendChild(textLayer);
    layout.appendChild(cWrap);
    container.appendChild(layout);

    // 讓畫布依「實際剩餘空間」放大到最大，而不是用固定的 vh 猜測比例：
    // 這樣不管螢幕高矮、側欄是否收合，畫布都會剛好撐滿剩下的高度，不會多留空白，也不會把畫面撐到需要捲動
    if(boardResizeHandler) window.removeEventListener("resize", boardResizeHandler);
    var stageWrapEl = document.querySelector(".stage-wrap");
    function fitCanvasToViewport(){
      if(!document.body.contains(cWrap)) return; // 題目已經切換掉了，這份畫布不在畫面上，略過
      var wrapRect = layout.getBoundingClientRect();
      var bottomLimit = stageWrapEl ? stageWrapEl.getBoundingClientRect().bottom : window.innerHeight;
      var availableHeight = bottomLimit - wrapRect.top - 6;
      var availableWidth = layout.clientWidth - vToolbar.offsetWidth - 16;
      var size = Math.max(220, Math.min(availableHeight, availableWidth));
      cWrap.style.maxWidth = Math.floor(size) + "px";
    }
    boardResizeHandler = fitCanvasToViewport;
    requestAnimationFrame(fitCanvasToViewport);
    window.addEventListener("resize", fitCanvasToViewport);

    var ctx = canvas.getContext("2d");
    var isDrawing = false;
    var currentPath = [];
    var activeSelectedTextId = null;

    vToolbar.querySelectorAll(".tool-btn-v").forEach(function(b){
      b.onclick = function(){
        if(b.id === "btn-upload-bg" || b.id === "btn-remove-bg" || b.id === "btn-clear-draw") return;
        vToolbar.querySelectorAll(".tool-btn-v").forEach(function(x){
          if(x.id !== "btn-upload-bg" && x.id !== "btn-remove-bg" && x.id !== "btn-clear-draw") x.classList.remove("active");
        });
        b.classList.add("active");
        boardState.tool = b.dataset.tool;
        canvas.style.cursor = (boardState.tool === "text" ? "text" : (boardState.tool.includes("eraser") ? "cell" : "crosshair"));
      };
    });

    var btnUploadBg = vToolbar.querySelector("#btn-upload-bg");
    var btnRemoveBg = vToolbar.querySelector("#btn-remove-bg");
    var bgFileInput = vToolbar.querySelector("#board-bg-file");

    if(btnUploadBg && bgFileInput){
      btnUploadBg.onclick = function(e){
        e.preventDefault(); e.stopPropagation();
        bgFileInput.click();
      };
      bgFileInput.onchange = function(e){
        var file = e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(evt){
          var img = new Image();
          img.onload = function(){
            var c = document.createElement("canvas");
            var scale = Math.min(1, 1000 / img.width);
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            var cx = c.getContext("2d");
            cx.drawImage(img, 0, 0, c.width, c.height);
            var b64 = c.toDataURL("image/jpeg", 0.8);
            q.bgImage = b64;
            writeProgress(q.id, { bgImage: b64 });
            writeSections(getSections());
            renderStage();
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      };
    }

    if(btnRemoveBg){
      btnRemoveBg.onclick = function(e){
        e.preventDefault(); e.stopPropagation();
        q.bgImage = "";
        writeProgress(q.id, { bgImage: "" });
        writeSections(getSections());
        renderStage();
      };
    }

    // 畫筆／打字兩個顏色面板各有一份「黑/白」色點，兩邊都要一起依主題更新，不能只更新第一個
    var darkColorDots = vToolbar.querySelectorAll(".dark-color-dot");
    if(darkColorDots.length){
      if(currentBgMode === "dark"){
        if(boardState.color === "#2A333C") boardState.color = "#FFFFFF";
        darkColorDots.forEach(function(d){ d.style.background = "#E5EAE6"; d.dataset.color = "#FFFFFF"; });
      } else {
        if(boardState.color === "#FFFFFF") boardState.color = "#2A333C";
        darkColorDots.forEach(function(d){ d.style.background = "#2A333C"; d.dataset.color = "#2A333C"; });
      }
    }

    function getScaleRatio(){
      var w = cWrap.clientWidth || canvas.width || 640;
      return Math.max(0.4, w / 640);
    }

    function resizeCanvas(){
      var r = cWrap.getBoundingClientRect();
      if(r.width > 0 && r.height > 0){
        canvas.width = r.width;
        canvas.height = r.height;
        redrawStrokes();
        renderTexts();
      }
    }
    requestAnimationFrame(resizeCanvas);
    window.addEventListener("resize", resizeCanvas);

    function redrawStrokes(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      var scale = getScaleRatio();
      strokes.forEach(function(st){
        if(!st.points || st.points.length < 2) return;
        ctx.save();
        if(st.isEraser){
          ctx.globalCompositeOperation = "destination-out";
          ctx.lineWidth = Math.max(2, st.size * 2.5 * scale);
        } else {
          ctx.globalCompositeOperation = "source-over";
          ctx.strokeStyle = st.color;
          ctx.lineWidth = Math.max(1, st.size * scale);
        }
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(st.points[0].x * canvas.width / 100, st.points[0].y * canvas.height / 100);
        for(var i=1; i<st.points.length; i++){
          ctx.lineTo(st.points[i].x * canvas.width / 100, st.points[i].y * canvas.height / 100);
        }
        ctx.stroke();
        ctx.restore();
      });
    }

    function renderTexts(){
      textLayer.innerHTML = "";
      var scale = getScaleRatio();

      texts.forEach(function(t, idx){
        var div = document.createElement("div");
        div.className = "movable-text" + (t.id === activeSelectedTextId ? " active" : "");
        div.style.left = t.x + "%";
        div.style.top = t.y + "%";
        div.style.color = t.color || "var(--ink)";

        var baseSize = t.fontSize || 36;
        div.style.fontSize = Math.round(baseSize * scale) + "px";

        div.innerHTML = `
          <span class="text-content">${t.text}</span>
          <div class="resize-handle" title="按住拖動縮放字體"></div>
        `;

        var handle = div.querySelector(".resize-handle");
        handle.onmousedown = function(e){
          e.stopPropagation(); e.preventDefault();
          var startSize = t.fontSize || 36;
          var centerRect = div.getBoundingClientRect();
          var centerX = centerRect.left + centerRect.width / 2;
          var centerY = centerRect.top + centerRect.height / 2;
          var startDist = Math.hypot(e.clientX - centerX, e.clientY - centerY) || 1;

          function onResizeMove(ev){
            var currentDist = Math.hypot(ev.clientX - centerX, ev.clientY - centerY);
            var ratio = currentDist / startDist;
            var newSize = Math.max(16, Math.min(120, Math.round(startSize * ratio)));
            t.fontSize = newSize;
            div.style.fontSize = Math.round(newSize * scale) + "px";
            if(fontSelect) fontSelect.value = String(newSize);
          }

          function onResizeUp(){
            window.removeEventListener("mousemove", onResizeMove);
            window.removeEventListener("mouseup", onResizeUp);
            writeProgress(q.id, { texts: texts });
          }

          window.addEventListener("mousemove", onResizeMove);
          window.addEventListener("mouseup", onResizeUp);
        };

        div.onmousedown = function(e){
          e.stopPropagation();

          if(boardState.tool === "stroke-eraser"){
            texts.splice(idx, 1);
            writeProgress(q.id, { texts: texts });
            return;
          }

          activeSelectedTextId = t.id;
          div.classList.add("active");
          if(fontSelect) fontSelect.value = String(t.fontSize || 36);

          var startX = e.clientX, startY = e.clientY;
          var origX = t.x, origY = t.y;
          var rect = cWrap.getBoundingClientRect();

          function onMove(ev){
            var dx = (ev.clientX - startX) / rect.width * 100;
            var dy = (ev.clientY - startY) / rect.height * 100;
            t.x = Math.max(5, Math.min(95, origX + dx));
            t.y = Math.max(5, Math.min(95, origY + dy));
            div.style.left = t.x + "%";
            div.style.top = t.y + "%";
          }

          function onUp(){
            div.classList.remove("active");
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            writeProgress(q.id, { texts: texts });
          }

          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        };

        textLayer.appendChild(div);
      });
    }

    function getPos(e){
      var r = cWrap.getBoundingClientRect();
      var cx = e.touches ? e.touches[0].clientX : e.clientX;
      var cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - r.left) / r.width * 100,
        y: (cy - r.top) / r.height * 100
      };
    }

    function checkStrokeHit(p){
      for(var i = strokes.length - 1; i >= 0; i--){
        var pts = strokes[i].points;
        for(var j=0; j<pts.length; j++){
          var dist = Math.hypot(pts[j].x - p.x, pts[j].y - p.y);
          if(dist < 3.5){
            strokes.splice(i, 1);
            writeProgress(q.id, { strokes: strokes });
            return true;
          }
        }
      }
      return false;
    }

    canvas.onmousedown = function(e){
      if(!canInteract()) return;
      e.preventDefault(); // 避免瀏覽器預設的 mousedown 行為把新建立的文字輸入框焦點搶走
      var p = getPos(e);
      activeSelectedTextId = null;

      if(boardState.tool === "stroke-eraser"){
        checkStrokeHit(p);
        return;
      }
      if(boardState.tool === "text"){
        showInlineTextInput(cWrap, p, function(txt){
          if(txt && txt.trim()){
            texts.push({
              id: uid("t"),
              text: txt.trim(),
              x: p.x,
              y: p.y,
              color: boardState.color,
              fontSize: boardState.fontSize || 36
            });
            writeProgress(q.id, { texts: texts });
          }
        });
        return;
      }

      isDrawing = true;
      currentPath = [p];
    };

    window.onmousemove = function(e){
      if(!isDrawing) return;
      var p = getPos(e);
      currentPath.push(p);

      var scale = getScaleRatio();
      ctx.save();
      if(boardState.tool === "pixel-eraser"){
        ctx.globalCompositeOperation = "destination-out";
        ctx.lineWidth = Math.max(2, boardState.size * 2.5 * scale);
      } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = boardState.color;
        ctx.lineWidth = Math.max(1, boardState.size * scale);
      }
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath();
      var pts = currentPath;
      if(pts.length >= 2){
        ctx.moveTo(pts[pts.length-2].x * canvas.width / 100, pts[pts.length-2].y * canvas.height / 100);
        ctx.lineTo(p.x * canvas.width / 100, p.y * canvas.height / 100);
        ctx.stroke();
      }
      ctx.restore();
    };

    window.onmouseup = function(){
      if(!isDrawing) return;
      isDrawing = false;
      if(currentPath.length >= 2){
        strokes.push({
          id: uid("st"),
          points: currentPath,
          color: boardState.color,
          size: boardState.size,
          isEraser: boardState.tool === "pixel-eraser"
        });
        writeProgress(q.id, { strokes: strokes });
      }
      currentPath = [];
    };

    var fontSelect = vToolbar.querySelector(".board-font-select");
    if(fontSelect){
      fontSelect.onchange = function(){
        boardState.fontSize = Number(fontSelect.value);
        if(activeSelectedTextId){
          var selObj = texts.find(function(item){ return item.id === activeSelectedTextId; });
          if(selObj){
            selObj.fontSize = boardState.fontSize;
            writeProgress(q.id, { texts: texts });
          }
        }
      };
    }

    vToolbar.querySelectorAll(".grid-btn-v").forEach(function(gb){
      gb.onclick = function(){
        vToolbar.querySelectorAll(".grid-btn-v").forEach(function(x){ x.classList.remove("active"); });
        gb.classList.add("active");
        var gType = gb.dataset.grid;
        cWrap.className = "canvas-stage-wrap " + (gType === 'tian' ? 'grid-tian' : (gType === 'jiu' ? 'grid-jiu' : ''));
        writeProgress(q.id, { gridType: gType });
      };
    });

    vToolbar.querySelectorAll(".color-dot").forEach(function(d){
      d.onclick = function(){
        var newColor = d.dataset.color;
        boardState.color = newColor;
        // 畫筆／打字兩個顏色面板各有一份色點，用顏色值同步兩邊的選取狀態，而不是只標記被點的那一顆
        vToolbar.querySelectorAll(".color-dot").forEach(function(x){
          x.classList.toggle("active", x.dataset.color === newColor);
        });
      };
    });

    vToolbar.querySelectorAll(".size-btn-v").forEach(function(sBtn){
      sBtn.onclick = function(){
        vToolbar.querySelectorAll(".size-btn-v").forEach(function(x){ x.classList.remove("active"); });
        sBtn.classList.add("active");
        boardState.size = Number(sBtn.dataset.size);
      };
    });

    var clearBtn = vToolbar.querySelector("#btn-clear-draw");
    if(clearBtn){
      clearBtn.onclick = function(){
        if(confirm("確定要清空畫布上的所有內容嗎？")){
          strokes = []; texts = [];
          writeProgress(q.id, { strokes: strokes, texts: texts });
        }
      };
    }
  }

  /* ================== 啟動流程（大廳 / 學生加入房間） ================== */
  function joinAsStudent(){
    attachPresence(urlRoom, myId, myName);
    startRoom(urlRoom, "student");
  }

  if(urlRoom){
    if(isStudent){
      if(!myName){
        safeShowModal(document.getElementById("student-name-dialog"));
        var submitNameBtn = document.getElementById("btn-submit-student-name");
        var nameInput = document.getElementById("input-student-name");
        submitNameBtn.onclick = function(){
          var val = nameInput.value.trim();
          if(!val){ alert("請輸入你的名字！"); return; }
          myName = val;
          closeModalDialog(document.getElementById("student-name-dialog"));
          joinAsStudent();
        };
        nameInput.addEventListener("keydown", function(ev){
          if(ev.key === "Enter"){ ev.preventDefault(); submitNameBtn.click(); }
        });
      } else {
        joinAsStudent();
      }
    } else {
      startRoom(urlRoom, "teacher");
    }
  } else {
    showLobby();
  }
})();
</script>
</body>
