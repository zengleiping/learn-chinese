    layout.appendChild(cWrap); container.appendChild(layout);

    var ctx = canvas.getContext("2d");
    var isDrawing = false;
    var currentPath = [];
    var activeSelectedTextId = null;

    vToolbar.querySelectorAll(".tool-btn-v").forEach(function(b){
      b.onclick = function(){
        if(b.id === "btn-upload-bg" || b.id === "btn-remove-bg" || b.id === "btn-clear-draw") return;
        vToolbar.querySelectorAll(".tool-btn-v").forEach(function(x){
          if(x.id !== "btn-upload-bg" && x.id !== "btn-remove-bg" && x.id !== "btn-clear-draw") x.classList.remove("active");
        });
        b.classList.add("active");
        boardState.tool = b.dataset.tool;
        canvas.style.cursor = (boardState.tool === "text" ? "text" : (boardState.tool.includes("eraser") ? "cell" : "crosshair"));
      };
    });

    var btnUploadBg = vToolbar.querySelector("#btn-upload-bg");
    var btnRemoveBg = vToolbar.querySelector("#btn-remove-bg");
    var bgFileInput = vToolbar.querySelector("#board-bg-file");

    if(btnUploadBg && bgFileInput){
      btnUploadBg.onclick = function(e){
        e.preventDefault(); e.stopPropagation();
        bgFileInput.click();
      };
      bgFileInput.onchange = function(e){
        var file = e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(evt){
          var img = new Image();
          img.onload = function(){
            var c = document.createElement("canvas");
            var scale = Math.min(1, 1000 / img.width);
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            var cx = c.getContext("2d");
            cx.drawImage(img, 0, 0, c.width, c.height);
            var b64 = c.toDataURL("image/jpeg", 0.8);
            q.bgImage = b64;
            writeProgress(q.id, { bgImage: b64 });
            writeSections(getSections());
            renderStage();
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      };
    }

    if(btnRemoveBg){
      btnRemoveBg.onclick = function(e){
        e.preventDefault(); e.stopPropagation();
        q.bgImage = "";
        writeProgress(q.id, { bgImage: "" });
        writeSections(getSections());
        renderStage();
      };
    }

    var darkColorDot = vToolbar.querySelector("#btn-theme-dark-color");
    if(darkColorDot){
      if(currentBgMode === "dark"){
        darkColorDot.style.background = "#E5EAE6";
        darkColorDot.dataset.color = "#FFFFFF";
        if(boardState.color === "#2A333C") boardState.color = "#FFFFFF";
      } else {
        darkColorDot.style.background = "#2A333C";
        darkColorDot.dataset.color = "#2A333C";
        if(boardState.color === "#FFFFFF") boardState.color = "#2A333C";
      }
    }

    function getScaleRatio(){
      var w = cWrap.clientWidth || canvas.width || 640;
      return Math.max(0.4, w / 640);
    }

    function resizeCanvas(){
      var r = cWrap.getBoundingClientRect();
      if(r.width > 0 && r.height > 0){
        canvas.width = r.width; canvas.height = r.height;
        redrawStrokes();
        renderTexts();
      }
    }
    requestAnimationFrame(resizeCanvas);
    window.addEventListener("resize", resizeCanvas);

    function redrawStrokes(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      var scale = getScaleRatio();
      strokes.forEach(function(st){
        if(!st.points || st.points.length < 2) return;
        ctx.save();
        if(st.isEraser){
          ctx.globalCompositeOperation = "destination-out";
          ctx.lineWidth = Math.max(2, st.size * 2.5 * scale);
        } else {
          ctx.globalCompositeOperation = "source-over";
          ctx.strokeStyle = st.color;
          ctx.lineWidth = Math.max(1, st.size * scale);
        }
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(st.points[0].x * canvas.width / 100, st.points[0].y * canvas.height / 100);
        for(var i=1; i<st.points.length; i++){
          ctx.lineTo(st.points[i].x * canvas.width / 100, st.points[i].y * canvas.height / 100);
        }
        ctx.stroke();
        ctx.restore();
      });
    }

    function renderTexts(){
      textLayer.innerHTML = "";
      var scale = getScaleRatio();

      texts.forEach(function(t, idx){
        var div = document.createElement("div");
        div.className = "movable-text" + (t.id === activeSelectedTextId ? " active" : "");
        div.style.left = t.x + "%";
        div.style.top = t.y + "%";
        div.style.color = t.color || "var(--ink)";
        
        var baseSize = t.fontSize || 36;
        div.style.fontSize = Math.round(baseSize * scale) + "px";

        div.innerHTML = `
          <span class="text-content">${t.text}</span>
          <div class="resize-handle" title="按住拖動縮放字體"></div>
        `;

        var handle = div.querySelector(".resize-handle");
        handle.onmousedown = function(e){
          e.stopPropagation(); e.preventDefault();
          var startSize = t.fontSize || 36;
          var centerRect = div.getBoundingClientRect();
          var centerX = centerRect.left + centerRect.width / 2;
          var centerY = centerRect.top + centerRect.height / 2;
          var startDist = Math.hypot(e.clientX - centerX, e.clientY - centerY) || 1;

          function onResizeMove(ev){
            var currentDist = Math.hypot(ev.clientX - centerX, ev.clientY - centerY);
            var ratio = currentDist / startDist;
            var newSize = Math.max(16, Math.min(120, Math.round(startSize * ratio)));
            t.fontSize = newSize;
            div.style.fontSize = Math.round(newSize * scale) + "px";
            if(fontSelect) fontSelect.value = String(newSize);
          }

          function onResizeUp(){
            window.removeEventListener("mousemove", onResizeMove);
            window.removeEventListener("mouseup", onResizeUp);
            writeProgress(q.id, { texts: texts });
          }

          window.addEventListener("mousemove", onResizeMove);
          window.addEventListener("mouseup", onResizeUp);
        };

        div.onmousedown = function(e){
          e.stopPropagation();

          if(boardState.tool === "stroke-eraser"){
            texts.splice(idx, 1);
            writeProgress(q.id, { texts: texts });
            return;
          }

          activeSelectedTextId = t.id;
          div.classList.add("active");
          if(fontSelect) fontSelect.value = String(t.fontSize || 36);

          var startX = e.clientX, startY = e.clientY;
          var origX = t.x, origY = t.y;
          var rect = cWrap.getBoundingClientRect();

          function onMove(ev){
            var dx = (ev.clientX - startX) / rect.width * 100;
            var dy = (ev.clientY - startY) / rect.height * 100;
            t.x = Math.max(5, Math.min(95, origX + dx));
            t.y = Math.max(5, Math.min(95, origY + dy));
            div.style.left = t.x + "%";
            div.style.top = t.y + "%";
          }

          function onUp(){
            div.classList.remove("active");
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            writeProgress(q.id, { texts: texts });
          }

          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        };

        textLayer.appendChild(div);
      });
    }

    function getPos(e){
      var r = cWrap.getBoundingClientRect();
      var cx = e.touches ? e.touches[0].clientX : e.clientX;
      var cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - r.left) / r.width * 100,
        y: (cy - r.top) / r.height * 100
      };
    }

    function checkStrokeHit(p){
      for(var i = strokes.length - 1; i >= 0; i--){
        var pts = strokes[i].points;
        for(var j=0; j<pts.length; j++){
          var dist = Math.hypot(pts[j].x - p.x, pts[j].y - p.y);
          if(dist < 3.5){
            strokes.splice(i, 1);
            writeProgress(q.id, { strokes: strokes });
            return true;
          }
        }
      }
      return false;
    }

    canvas.onmousedown = function(e){
      if(!canInteract()) return;
      var p = getPos(e);
      activeSelectedTextId = null;

      if(boardState.tool === "stroke-eraser"){
        checkStrokeHit(p);
        return;
      }
      if(boardState.tool === "text"){
        var txt = prompt("請輸入文字內容（漢字或拼音）：");
        if(txt && txt.trim()){
          texts.push({ 
            id: uid("t"), 
            text: txt.trim(), 
            x: p.x, 
            y: p.y, 
            color: boardState.color, 
            fontSize: boardState.fontSize || 36 
          });
          writeProgress(q.id, { texts: texts });
        }
        return;
      }

      isDrawing = true;
      currentPath = [p];
    };

    window.onmousemove = function(e){
      if(!isDrawing) return;
      var p = getPos(e);
      currentPath.push(p);

      var scale = getScaleRatio();
      ctx.save();
      if(boardState.tool === "pixel-eraser"){
        ctx.globalCompositeOperation = "destination-out";
        ctx.lineWidth = Math.max(2, boardState.size * 2.5 * scale);
      } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = boardState.color;
        ctx.lineWidth = Math.max(1, boardState.size * scale);
      }
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath();
      var pts = currentPath;
      if(pts.length >= 2){
        ctx.moveTo(pts[pts.length-2].x * canvas.width / 100, pts[pts.length-2].y * canvas.height / 100);
        ctx.lineTo(p.x * canvas.width / 100, p.y * canvas.height / 100);
        ctx.stroke();
      }
      ctx.restore();
    };

    window.onmouseup = function(){
      if(!isDrawing) return;
      isDrawing = false;
      if(currentPath.length >= 2){
        strokes.push({
          id: uid("st"),
          points: currentPath,
          color: boardState.color,
          size: boardState.size,
          isEraser: boardState.tool === "pixel-eraser"
        });
        writeProgress(q.id, { strokes: strokes });
      }
      currentPath = [];
    };

    var fontSelect = vToolbar.querySelector(".board-font-select");
    if(fontSelect){
      fontSelect.onchange = function(){
        boardState.fontSize = Number(fontSelect.value);
        if(activeSelectedTextId){
          var selObj = texts.find(function(item){ return item.id === activeSelectedTextId; });
          if(selObj){
            selObj.fontSize = boardState.fontSize;
            writeProgress(q.id, { texts: texts });
          }
        }
      };
    }

    vToolbar.querySelectorAll(".grid-btn-v").forEach(function(gb){
      gb.onclick = function(){
        vToolbar.querySelectorAll(".grid-btn-v").forEach(function(x){ x.classList.remove("active"); });
        gb.classList.add("active");
        var gType = gb.dataset.grid;
        cWrap.className = "canvas-stage-wrap " + (gType === 'tian' ? 'grid-tian' : (gType === 'jiu' ? 'grid-jiu' : ''));
        writeProgress(q.id, { gridType: gType });
      };
    });

    vToolbar.querySelectorAll(".color-dot").forEach(function(d){
      d.onclick = function(){
        vToolbar.querySelectorAll(".color-dot").forEach(function(x){ x.classList.remove("active"); });
        d.classList.add("active");
        boardState.color = d.dataset.color;
      };
    });

    vToolbar.querySelectorAll(".size-btn-v").forEach(function(sBtn){
      sBtn.onclick = function(){
        vToolbar.querySelectorAll(".size-btn-v").forEach(function(x){ x.classList.remove("active"); });
        sBtn.classList.add("active");
        boardState.size = Number(sBtn.dataset.size);
      };
    });

    var clearBtn = vToolbar.querySelector("#btn-clear-draw");
    if(clearBtn){
      clearBtn.onclick = function(){
        if(confirm("確定要清空畫布上的所有內容嗎？")){
          strokes = []; texts = [];
          writeProgress(q.id, { strokes: strokes, texts: texts });
        }
      };
    }
  }

  /* 遠端游標 */
  function renderMultiCursors(cursorData){
    var container = document.getElementById("multi-cursor-box");
    if(!container) return;
    container.innerHTML = "";
    if(!cursorData || !cursorOn) return;

    Object.keys(cursorData).forEach(function(peerId){
      if(peerId === myId) return;

      var c = cursorData[peerId];
      if(!c || c.x == null) return;

      var isTeacherCursor = (c.role === "teacher" || peerId === "teacher");
      var displayName = isTeacherCursor ? "👑 老師" : (c.name || "學生");
      var color = isTeacherCursor ? "#B23B32" : getColorForStudent(displayName, "student");

      var el = document.createElement("div");
      el.className = "peer-cursor";
      el.style.left = c.x + "%";
      el.style.top = c.y + "%";

      el.innerHTML = `
        <span class="peer-cursor-dot" style="background:${color};"></span>
        <span class="peer-cursor-label" style="background:${color};">${displayName}</span>
      `;
      container.appendChild(el);
    });
  }

  var lastM = 0;
  function handleCursorMove(clientX, clientY){
    if(!inRoom() || !cursorOn) return;
    var now = Date.now();
    if(now - lastM < 40) return;
    lastM = now;

    var boardArea = document.getElementById("board-area");
    if(!boardArea) return;
    var r = boardArea.getBoundingClientRect();
    if(r.width === 0 || r.height === 0) return;

    var x = ((clientX - r.left) / r.width) * 100;
    var y = ((clientY - r.top) / r.height) * 100;

    if(x < -10 || x > 110 || y < -10 || y > 110){
      update(ref(db, "roomCursors/" + activeRoomId + "/" + myId), { x: null, y: null });
      return;
    }

    x = Math.max(0, Math.min(100, x));
    y = Math.max(0, Math.min(100, y));

    update(ref(db, "roomCursors/" + activeRoomId + "/" + myId), { 
      x: x, 
      y: y, 
      name: myName,
      role: roomRole 
    });
  }

  window.addEventListener("mousemove", function(e){
    handleCursorMove(e.clientX, e.clientY);
  });

  window.addEventListener("touchmove", function(e){
    if(e.touches && e.touches[0]){
      handleCursorMove(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  /* 畫面縮放按鈕監聽 */
  var btnZoomIn = document.getElementById("btn-zoom-in");
  var btnZoomOut = document.getElementById("btn-zoom-out");
  var btnZoomReset = document.getElementById("zoom-percent-text");

  if(btnZoomIn) btnZoomIn.onclick = function(){ applyStageZoom(currentZoomRatio + 0.1); };
  if(btnZoomOut) btnZoomOut.onclick = function(){ applyStageZoom(currentZoomRatio - 0.1); };
  if(btnZoomReset) btnZoomReset.onclick = function(){ applyStageZoom(1.0); };

  /* 設定面板操作 */
  var soundSelect = document.getElementById("setting-sound-style");
  soundSelect.value = currentSoundStyle;

  soundSelect.onchange = function(){
    currentSoundStyle = soundSelect.value;
    localStorage.setItem("hanyu_sound_style", currentSoundStyle);
  };

  document.querySelectorAll(".btn-mode-toggle").forEach(function(b){
    b.onclick = function(){
      currentClassMode = b.dataset.mode;
      localStorage.setItem("hanyu_class_mode", currentClassMode);
      applyTheme(currentBgMode, currentAccentColor, true);
    };
  });

  document.querySelectorAll(".btn-theme-bg").forEach(function(b){
    b.onclick = function(){
      applyTheme(b.dataset.bg, currentAccentColor, true);
    };
  });

  document.querySelectorAll(".btn-theme-accent").forEach(function(b){
    b.onclick = function(){
      applyTheme(currentBgMode, b.dataset.accent, true);
    };
  });

  var testSoundBtn = document.getElementById("btn-test-sound");
  if(testSoundBtn){
    testSoundBtn.onclick = function(e){
      e.preventDefault();
      var ctx = getAudioContext();
      if(ctx.state === 'suspended'){
        ctx.resume().then(runTest);
      } else {
        runTest();
      }

      function runTest(){
        var previewStyle = soundSelect ? soundSelect.value : currentSoundStyle;
        playTone(previewStyle, true);
        setTimeout(function(){
          playTone(previewStyle, false);
        }, 600);
      }
    };
  }

  document.getElementById("btn-close-settings").onclick = function(){
    currentSoundStyle = soundSelect.value;
    localStorage.setItem("hanyu_sound_style", currentSoundStyle);
    closeModalDialog(document.getElementById("settings-dialog"));
  };

  /* 大題新增／編輯彈窗（含智慧自動命名） */
  var sectionDialog = document.getElementById("section-dialog");
  var sectionTypeToggle = document.getElementById("section-type-toggle");
  var currentSectionType = "match";

  sectionTypeToggle.querySelectorAll("button").forEach(function(b){
    b.onclick = function(){
      sectionTypeToggle.querySelectorAll("button").forEach(function(x){ x.classList.remove("active"); });
      b.classList.add("active");
      currentSectionType = b.dataset.type;
    };
  });

  document.getElementById("btn-new-section").onclick = function(){
    editingSectionId = null;
    document.getElementById("f-sec-title").value = "";
    document.getElementById("f-sec-desc").value = "";
    document.getElementById("section-dialog-title").textContent = "新增試卷大題";
    safeShowModal(sectionDialog);
  };

  document.getElementById("btn-cancel-section").onclick = function(){ closeModalDialog(sectionDialog); };

  document.getElementById("section-form").onsubmit = function(e){
    e.preventDefault();
    var title = document.getElementById("f-sec-title").value.trim();
    var desc = document.getElementById("f-sec-desc").value.trim();
    
    var secs = Object.assign({}, getSections());
    if(editingSectionId){
      if(!title){
        var typeNamesEdit = { match: "生詞配對大題", choice: "語意選擇大題", reorder: "句子重組大題", board: "漢字書寫大題" };
        title = typeNamesEdit[secs[editingSectionId].type] || "綜合練習大題";
      }
      secs[editingSectionId].title = title;
      secs[editingSectionId].desc = desc;
    } else {
      if(!title){
        var typeNames = { match: "生詞配對大題", choice: "語意選擇大題", reorder: "句子重組大題", board: "漢字書寫大題" };
        var count = Object.keys(secs).length + 1;
        title = (typeNames[currentSectionType] || "綜合練習大題") + " (" + count + ")";
      }
      var newSecId = uid("sec");
      var defaultQId = uid("q");
      var currentKeys = Object.keys(secs);

      var defaultQ = { id: defaultQId, title: "第 1 題", order: 0 };
      if(currentSectionType === "match"){
        defaultQ.leftLabel = "生詞"; defaultQ.rightLabel = "拼音";
        defaultQ.pairs = { p1: {id:"p1", left:"你好", right:"nǐ hǎo"} };
      } else if(currentSectionType === "choice"){
        defaultQ.prompt = "請選出正確答案(可複選)：";
        defaultQ.choices = { c1: {id:"c1", text:"選項 A"}, c2: {id:"c2", text:"選項 B"} };
        defaultQ.answerIds = ["c1"];
      } else if(currentSectionType === "reorder"){
        defaultQ.prompt = "請將下列詞語重組為正確句子";
        defaultQ.words = ["我", "愛", "學", "華語"];
      } else {
        defaultQ.desc = "漢字臨摹與書寫練習";
        defaultQ.bgImage = ""; defaultQ.gridType = "jiu";
      }

      secs[newSecId] = {
        id: newSecId,
        title: title,
        desc: desc,
        type: currentSectionType,
        order: currentKeys.length,
        collapsed: false,
        questions: { [defaultQId]: defaultQ }
      };

      writeSections(secs, defaultQId);
    }

    closeModalDialog(sectionDialog);
  };

  /* 小題題目編輯彈窗（含自動編號） */
  var editorDialog = document.getElementById("editor-dialog");
  var matchFields = document.getElementById("match-fields");
  var choiceFields = document.getElementById("choice-fields");
  var reorderFields = document.getElementById("reorder-fields");
  var boardFields = document.getElementById("board-fields");
  var uploadedBase64 = "";

  var choiceOptRows = document.getElementById("choice-opt-rows");
  function addChoiceOptRow(text, isChecked){
    var row = document.createElement("div"); row.className = "choice-row";
    row.innerHTML = `
      <input type="checkbox" class="mc-correct-chk" ${isChecked ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--bamboo);" title="勾選代表正確答案(可多選)">
      <input type="text" class="mc-opt-text" placeholder="輸入選項內容" value="${text || ''}">
      <button type="button" class="row-del">✕</button>
    `;
    row.querySelector(".row-del").onclick = function(){ if(choiceOptRows.children.length > 2) row.remove(); };
    choiceOptRows.appendChild(row);
  }
  document.getElementById("add-mc-opt").onclick = function(){ addChoiceOptRow("", false); };

  var pairRows = document.getElementById("pair-rows");
  function addPairRow(l, r){
    var row = document.createElement("div"); row.className = "pair-row";
    row.innerHTML = `
      <input type="text" class="pair-left" placeholder="生詞" value="${l || ''}">
      <input type="text" class="pair-right" placeholder="拼音／意思" value="${r || ''}">
      <button type="button" class="row-del">✕</button>
    `;
    row.querySelector(".row-del").onclick = function(){ if(pairRows.children.length > 2) row.remove(); };
    pairRows.appendChild(row);
  }
  document.getElementById("add-pair").onclick = function(){ addPairRow("", ""); };

  var fileInput = document.getElementById("f-board-img");
  document.getElementById("upload-box").onclick = function(){ fileInput.click(); };
  fileInput.onchange = function(e){
    var f = e.target.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      var img = new Image();
      img.onload = function(){
        var c = document.createElement("canvas");
        var scale = Math.min(1, 900 / img.width);
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        var cx = c.getContext("2d");
        cx.drawImage(img, 0, 0, c.width, c.height);
        uploadedBase64 = c.toDataURL("image/jpeg", 0.75);
        document.getElementById("upload-tip").textContent = "✅ 已上傳圖片：" + f.name;
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(f);
  };

  function openQuestionDialog(sectionId, editQuestionId){
    activeSectionForAdd = sectionId;
    editingQuestionId = editQuestionId || null;
    var secs = getSections();
    var sec = secs[sectionId];
    if(!sec) return;

    var secType = sec.type;
    matchFields.style.display = secType === "match" ? "" : "none";
    choiceFields.style.display = secType === "choice" ? "" : "none";
    reorderFields.style.display = secType === "reorder" ? "" : "none";
    boardFields.style.display = secType === "board" ? "" : "none";

    uploadedBase64 = "";
    document.getElementById("upload-tip").textContent = "📷 點擊上傳背景圖片（JPG/PNG）";
    pairRows.innerHTML = ""; choiceOptRows.innerHTML = "";

    if(editingQuestionId){
      document.getElementById("editor-dialog-title").textContent = "編輯現有題目";
      var q = sec.questions[editingQuestionId];
      document.getElementById("f-title").value = q.title || "";

      if(secType === "match"){
        document.getElementById("f-left-label").value = q.leftLabel || "生詞";
        document.getElementById("f-right-label").value = q.rightLabel || "拼音／意思";
        var pKeys = Object.keys(q.pairs || {});
        if(pKeys.length === 0) addPairRow("", "");
        pKeys.forEach(function(pk){ addPairRow(q.pairs[pk].left, q.pairs[pk].right); });
      } else if(secType === "choice"){
        document.getElementById("f-choice-prompt").value = q.prompt || "";
        var ansIds = q.answerIds || (q.answerId ? [q.answerId] : []);
        var cKeys = Object.keys(q.choices || {});
        if(cKeys.length === 0) addChoiceOptRow("", false);
        cKeys.forEach(function(ck){
          var isCorrect = ansIds.indexOf(ck) !== -1;
          addChoiceOptRow(q.choices[ck].text, isCorrect);
        });
      } else if(secType === "reorder"){
        document.getElementById("f-reorder-prompt").value = q.prompt || "";
        document.getElementById("f-reorder-answer").value = q.words ? q.words.join(", ") : "";
      } else if(secType === "board"){
        document.getElementById("f-board-desc").value = q.desc || "";
        if(q.bgImage){
          uploadedBase64 = q.bgImage;
          document.getElementById("upload-tip").textContent = "✅ 已載入現有底圖";
        }
      }
    } else {
      document.getElementById("editor-dialog-title").textContent = "新增小題題目";
      var count = Object.keys(sec.questions || {}).length;
      document.getElementById("f-title").value = `第 ${count + 1} 題`;
      if(secType === "match"){ addPairRow("你好", "nǐ hǎo"); addPairRow("謝謝", "xièxie"); }
      else if(secType === "choice"){ addChoiceOptRow("選項 A", true); addChoiceOptRow("選項 B", false); }
      else if(secType === "reorder"){
        document.getElementById("f-reorder-prompt").value = "請將下列詞語重組為正確句子";
        document.getElementById("f-reorder-answer").value = "我, 愛, 學, 華語";
      }
    }
    safeShowModal(editorDialog);
  }

  document.getElementById("btn-cancel").onclick = function(){ closeModalDialog(editorDialog); };

  document.getElementById("editor-form").onsubmit = function(e){
    e.preventDefault();
    var title = document.getElementById("f-title").value.trim();
    if(!activeSectionForAdd) return;

    var secs = Object.assign({}, getSections());
    var sec = secs[activeSectionForAdd];
    if(!sec) return;

    var qKeys = Object.keys(sec.questions || {});
    if(!title){
      title = `第 ${editingQuestionId ? (qKeys.indexOf(editingQuestionId) + 1) : (qKeys.length + 1)} 題`;
    }

    var qId = editingQuestionId || uid("q");
    var existingOrder = (editingQuestionId && sec.questions[editingQuestionId]) ? sec.questions[editingQuestionId].order : qKeys.length;
    var newQ = { id: qId, title: title, order: existingOrder };

    if(sec.type === "board"){
      newQ.desc = document.getElementById("f-board-desc").value.trim();
      newQ.bgImage = uploadedBase64 || (editingQuestionId && sec.questions[editingQuestionId] ? sec.questions[editingQuestionId].bgImage : "");
      newQ.gridType = "jiu";
    } else if(sec.type === "choice"){
      var choices = {}; var answerIds = [];
      choiceOptRows.querySelectorAll(".choice-row").forEach(function(r, idx){
        var txt = r.querySelector(".mc-opt-text").value.trim();
        var isChecked = r.querySelector(".mc-correct-chk").checked;
        if(txt){
          var cid = "c" + (idx + 1); choices[cid] = { id: cid, text: txt };
          if(isChecked) answerIds.push(cid);
        }
      });
      if(answerIds.length === 0 && Object.keys(choices).length > 0) answerIds.push(Object.keys(choices)[0]);
      newQ.prompt = document.getElementById("f-choice-prompt").value.trim() || title;
      newQ.choices = choices; newQ.answerIds = answerIds;
    } else if(sec.type === "reorder"){
      var rawStr = document.getElementById("f-reorder-answer").value.trim();
      var words = rawStr ? rawStr.split(/[,，\s]+/).filter(Boolean) : ["我", "是", "學生"];
      newQ.prompt = document.getElementById("f-reorder-prompt").value.trim() || title;
      newQ.words = words;
    } else if(sec.type === "match"){
      var pairs = {};
      pairRows.querySelectorAll(".pair-row").forEach(function(r, idx){
        var l = r.querySelector(".pair-left").value.trim();
        var rt = r.querySelector(".pair-right").value.trim();
        if(l && rt) pairs["p" + (idx + 1)] = { id: "p" + (idx + 1), left: l, right: rt };
      });
      newQ.leftLabel = document.getElementById("f-left-label").value.trim() || "生詞";
      newQ.rightLabel = document.getElementById("f-right-label").value.trim() || "拼音／意思";
      newQ.pairs = pairs;
    }

    if(!sec.questions) sec.questions = {};
    sec.questions[qId] = newQ;
    writeSections(secs, qId);
    closeModalDialog(editorDialog);
  };

  /* Excel 匯入／匯出 */
  var excelInput = document.getElementById("excel-file-input");
  document.getElementById("btn-import-excel").onclick = function(){ excelInput.click(); };
  excelInput.onchange = function(e){
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try {
        var data = new Uint8Array(evt.target.result); var wb = XLSX.read(data, { type: 'array' });
        var ws = wb.Sheets[wb.SheetNames[0]]; var rows = XLSX.utils.sheet_to_json(ws);
        if(!rows || rows.length === 0){ alert("Excel 檔案內沒有資料！"); return; }
        var newSections = Object.assign({}, getSections()); var grouped = {};
        rows.forEach(function(row){
          var secTitle = row["大題名稱"] || row["Section"] || "第一大題";
          var type = (row["題型"] || row["Type"] || "match").toLowerCase();
          if(!grouped[secTitle]) grouped[secTitle] = { title: secTitle, type: type, questions: {} };
          var qTitle = row["小題名稱"] || row["Question"] || "第 1 題";
          if(!grouped[secTitle].questions[qTitle]) grouped[secTitle].questions[qTitle] = { title: qTitle, rows: [] };
          grouped[secTitle].questions[qTitle].rows.push(row);
        });
        var firstNewQId = null; var secOrder = Object.keys(newSections).length;
        Object.keys(grouped).forEach(function(secTitle){
          var gSec = grouped[secTitle]; var newSecId = uid("sec"); var questionsObj = {}; var qOrder = 0;
          Object.keys(gSec.questions).forEach(function(qTitle){
            var gQ = gSec.questions[qTitle]; var newQId = uid("q"); if(!firstNewQId) firstNewQId = newQId;
            if(gSec.type === "match"){
              var pairs = {};
              gQ.rows.forEach(function(it, idx){
                var pid = "p" + (idx + 1); var l = it["左欄生詞"] || ""; var r = it["右欄拼音或意思"] || "";
                if(l && r) pairs[pid] = { id: pid, left: String(l), right: String(r) };
              });
              questionsObj[newQId] = { id: newQId, title: qTitle, order: qOrder++, leftLabel: "生詞", rightLabel: "拼音", pairs: pairs };
            } else if(gSec.type === "reorder"){
              var it = gQ.rows[0]; var wStr = it["正確句子"] || it["Words"] || "我,是,學生";
              questionsObj[newQId] = { id: newQId, title: qTitle, order: qOrder++, prompt: it["題目說明"] || qTitle, words: wStr.split(/[,，\s]+/) };
            }
          });
          newSections[newSecId] = { id: newSecId, title: secTitle, type: gSec.type, order: secOrder++, collapsed: false, questions: questionsObj };
        });
        writeSections(newSections, firstNewQId); alert("🎉 成功由 Excel 匯入題庫！");
      } catch(err){ alert("解析失敗。"); }
    };
    reader.readAsArrayBuffer(file);
  };

  document.getElementById("btn-dl-template").onclick = function(){
    var templateData = [
      { "大題名稱": "第一大題：生詞配對", "題型": "match", "小題名稱": "第1題", "左欄生詞": "你好", "右欄拼音或意思": "nǐ hǎo" },
      { "大題名稱": "第三大題：句子重組", "題型": "reorder", "小題名稱": "第1題", "正確句子": "我,愛,學,華語" }
    ];
    var ws = XLSX.utils.json_to_sheet(templateData); var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "範本"); XLSX.writeFile(wb, "曼米中文_範本.xlsx");
  };

  document.getElementById("btn-export-excel").onclick = function(){
    var secs = getSections(); var secKeys = getSortedSectionKeys(); var exportRows = [];
    secKeys.forEach(function(sid){
      var sec = secs[sid]; var qKeys = getSortedQuestionKeys(sec);
      qKeys.forEach(function(qid){
        var q = sec.questions[qid];
        if(sec.type === "match" && q.pairs){
          Object.keys(q.pairs).forEach(function(pid){
            exportRows.push({ "大題名稱": sec.title, "題型": sec.type, "小題名稱": q.title, "左欄生詞": q.pairs[pid].left, "右欄拼音或意思": q.pairs[pid].right });
          });
        } else if(sec.type === "reorder" && q.words){
          exportRows.push({ "大題名稱": sec.title, "題型": sec.type, "小題名稱": q.title, "正確句子": q.words.join(",") });
        }
      });
    });
    if(exportRows.length === 0){ alert("無題目可匯出"); return; }
    var ws = XLSX.utils.json_to_sheet(exportRows); var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "題庫"); XLSX.writeFile(wb, "曼米中文題庫備份.xlsx");
  };

  function handleStudentJoin(){
    if(!urlRoom) return;
    if(urlName){ myName = decodeURIComponent(urlName); attachPresence(urlRoom, myId, myName); startRoom(urlRoom, "student"); return; }
    var nameDialog = document.getElementById("student-name-dialog");
    safeShowModal(nameDialog);
    var submitBtn = document.getElementById("btn-submit-student-name");
    if(submitBtn){
      submitBtn.onclick = function(){
        var input = document.getElementById("input-student-name"); var entered = input ? input.value.trim() : "";
        if(!entered) entered = "學生 " + Math.floor(10 + Math.random()*90);
        myName = entered; closeModalDialog(nameDialog);
        attachPresence(urlRoom, myId, myName); startRoom(urlRoom, "student");
      };
    }
  }

  function onFirebaseReady(cb){ if(window.__firebaseReady) cb(); else window.addEventListener("firebase-bridge-ready", cb); }
  if(isStudent){ lobbyView.style.display = "none"; onFirebaseReady(handleStudentJoin); }
  else if(urlRoom){ onFirebaseReady(function(){ attachPresence(urlRoom, "teacher", "老師"); startRoom(urlRoom, "teacher"); }); }
  else { showLobby(); }
})();
</script>
