<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生詞練習台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Public+Sans:wght@400;500;600;700&display=swap">
<!-- SheetJS: 支援 Excel 匯入與匯出 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F3F5EF;
    --surface:#FFFFFF;
    --surface-2:#EAEDE4;
    --ink:#2A333C;
    --ink-soft:#66717A;
    --grid-line:rgba(42,51,60,0.08);
    --seal:#B23B32;
    --seal-soft:#F5DFDB;
    --seal-ring:rgba(178,59,50,0.38);
    --bamboo:#4C7A5E;
    --bamboo-soft:#DEEBE3;
    --shadow: 0 1px 2px rgba(42,33,28,0.06), 0 6px 20px -8px rgba(42,33,28,0.18);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B211E; --surface:#232B27; --surface-2:#2A332E;
      --ink:#E8EBE4; --ink-soft:#9BA79E; --grid-line:rgba(232,235,228,0.08);
      --seal:#E2695C; --seal-soft:#3D2624; --seal-ring:rgba(226,105,92,0.42);
      --bamboo:#7BB294; --bamboo-soft:#223229;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 24px -8px rgba(0,0,0,0.5);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);}
  .app{
    background:var(--paper); color:var(--ink);
    font-family:"Public Sans","Noto Sans TC",-apple-system,sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
  }
  h1,h2,h3,.zh{ font-family:"LXGW WenKai TC","Noto Serif TC",serif; }
  button, input, textarea, select{font-family:inherit;}
  button:focus-visible{outline:2.5px solid var(--seal); outline-offset:2px;}

  /* topbar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;background:var(--surface);
    border-bottom:1px solid var(--grid-line); gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .stamp{
    width:34px;height:34px;flex:none; background:var(--seal);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:"LXGW WenKai TC",serif;font-size:18px;font-weight:700;
    border-radius:6px; transform:rotate(-6deg); box-shadow:var(--shadow);
  }
  .brand-text h1{margin:0;font-size:18px;font-weight:700;}
  .brand-text p{margin:1px 0 0;font-size:12px;color:var(--ink-soft);}
  .topbar-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--grid-line); background:var(--surface); color:var(--ink);
    padding:7px 13px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
    transition:all .12s ease;
  }
  .btn:hover{border-color:var(--ink-soft);}
  .btn-primary{background:var(--seal);border-color:var(--seal);color:#fff;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}

  .room-cluster{display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--grid-line);border-radius:10px;background:var(--paper);}
  .room-code{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;}
  .room-code b{color:var(--seal);}
  .presence-dot{width:9px;height:9px;border-radius:50%;background:var(--ink-soft);flex:none;}
  .presence-dot.online{background:var(--bamboo);}
  
  .toggle{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);cursor:pointer;user-select:none;}
  .toggle-track{width:34px;height:18px;border-radius:99px;background:var(--surface-2);border:1px solid var(--grid-line);position:relative;transition:background .15s ease;}
  .toggle-track::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s ease;}
  .toggle.on .toggle-track{background:var(--bamboo);border-color:var(--bamboo);}
  .toggle.on .toggle-track::after{transform:translateX(16px);}

  /* 專案大廳 (封面首頁) */
  .lobby-wrap{
    flex:1;padding:36px clamp(16px, 5vw, 64px);
    max-width:1120px;margin:0 auto;width:100%;
  }
  .lobby-header{
    display:flex;align-items:flex-end;justify-content:space-between;
    margin-bottom:28px;gap:16px;flex-wrap:wrap;border-bottom:1.5px solid var(--grid-line);padding-bottom:18px;
  }
  .lobby-header h2{margin:0;font-size:24px;font-weight:700;}
  .lobby-header p{margin:4px 0 0;font-size:14px;color:var(--ink-soft);}
  .project-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:20px;
  }
  .project-card{
    background:var(--surface);border:1.5px solid var(--grid-line);border-radius:14px;
    padding:20px;display:flex;flex-direction:column;justify-content:space-between;
    min-height:180px;box-shadow:var(--shadow);transition:transform .15s ease, border-color .15s ease;
    position:relative;
  }
  .project-card:hover{transform:translateY(-3px);border-color:var(--seal);}
  .project-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .project-title{font-size:17px;font-weight:700;margin:0 0 6px;line-height:1.4;}
  .project-desc{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.5;}
  .project-card-foot{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:20px;padding-top:14px;border-top:1px solid var(--grid-line);
  }
  .project-badge{
    font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--ink-soft);
    padding:3px 8px;border-radius:6px;
  }
  .project-actions-btns{display:flex;gap:6px;}

  /* 教學主舞台佈局 */
  .layout{flex:1;display:grid;grid-template-columns:260px 1fr;min-height:0;}
  .app.student-mode .layout, .app.present .layout{grid-template-columns:1fr;}
  .app.student-mode .sidebar, .app.present .sidebar{display:none;}

  .sidebar{
    background:var(--surface); border-right:1px solid var(--grid-line); padding:16px;
    display:flex;flex-direction:column;gap:10px;overflow-y:auto;
  }
  .btn-new{width:100%;justify-content:center;padding:10px 14px;}
  .sidebar-excel-group{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
  
  .set-list{display:flex;flex-direction:column;gap:8px;}
  .set-card{
    text-align:left;border:1.5px solid var(--grid-line);background:var(--paper);
    border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;
  }
  .set-card:hover{border-color:var(--ink-soft);}
  .set-card.active{border-color:var(--seal);background:var(--seal-soft);}
  .set-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .set-card-title{font-size:14px;font-weight:600;}
  .badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-soft);}
  .set-card.active .badge{background:var(--seal);color:#fff;}
  .set-card-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:5px;align-self:flex-end;}
  .set-card-del:hover{color:var(--seal);}

  .stage-wrap{overflow-y:auto;padding:24px clamp(16px,4vw,40px);display:flex;justify-content:center;}
  .stage{
    width:100%;max-width:880px;background:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      var(--surface);
    background-size:28px 28px;border:1px solid var(--grid-line);border-radius:16px;
    padding:clamp(18px,3vw,32px); box-shadow:var(--shadow); min-height:450px; position:relative;
  }
  .app.student-mode .stage, .app.present .stage{max-width:1040px;}

  .stage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .stage-title{font-size:21px;font-weight:700;margin:0 0 4px;}
  .stage-sub{font-size:13px;color:var(--ink-soft);margin:0;}
  .stage-actions{display:flex;gap:8px;}

  /* 連連看樣式與對錯動畫 */
  .match-board{position:relative;}
  .match-cols{display:flex;justify-content:space-between;gap:clamp(20px,6vw,100px);position:relative;z-index:1;}
  .match-col{flex:1;display:flex;flex-direction:column;gap:12px;max-width:340px;}
  .match-col-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px;}
  .match-item{
    font-family:"LXGW WenKai TC",serif;font-size:18px;text-align:center;padding:12px 16px;
    border:2px solid var(--grid-line);background:var(--paper);color:var(--ink);border-radius:12px;cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .12s ease;
  }
  .match-item[data-side="right"]{font-family:"Public Sans",sans-serif;font-size:16px;}
  .match-item:hover:not(.matched):not(:disabled){border-color:var(--ink-soft);}
  .match-item.selected{border-color:var(--seal);box-shadow:0 0 0 3px var(--seal-ring) inset;}
  .match-item.matched{
    border-color:var(--bamboo);background:var(--bamboo-soft);color:var(--bamboo);
    font-weight:700;cursor:default;animation:popSuccess .3s ease;
  }
  .match-item.wrong{
    border-color:var(--seal) !important;
    background:var(--seal-soft) !important;
    color:var(--seal) !important;
    animation:shakeWrong .45s ease;
  }

  /* 選擇題與圈選題 */
  .circle-prompt{font-family:"LXGW WenKai TC",serif;font-size:20px;margin:0 0 18px;line-height:1.6;}
  .circle-choices{display:flex;flex-wrap:wrap;gap:14px;position:relative;}
  .circle-chip{
    font-family:"Public Sans","Noto Sans TC",sans-serif;font-size:16px;font-weight:500;padding:12px 22px;
    border-radius:48% 52% 51% 49% / 53% 47% 53% 47%;border:2.5px solid var(--grid-line);
    background:var(--paper);color:var(--ink);cursor:pointer;min-width:88px;text-align:center;transition:all .15s ease;
  }
  .circle-chip.selected{border-color:var(--seal);background:var(--seal-soft);color:var(--seal);font-weight:700;}
  .circle-chip.correct{border-color:var(--bamboo);background:var(--bamboo-soft);color:var(--bamboo);font-weight:700;animation:popSuccess .3s ease;}
  .circle-chip.missed{border-color:var(--bamboo);border-style:dashed;color:var(--bamboo);}
  .circle-chip.selected-wrong{border-color:var(--ink-soft);background:var(--surface-2);color:var(--ink-soft);text-decoration:line-through;}

  .mc-choices-container{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
  .mc-option-btn{
    padding:14px 20px;border-radius:12px;border:2px solid var(--grid-line);
    background:var(--paper);font-size:16.5px;font-weight:600;cursor:pointer;
    text-align:left;display:flex;align-items:center;gap:12px;transition:all .15s ease;
  }
  .mc-option-btn:hover:not(:disabled){border-color:var(--ink-soft);background:var(--surface);}
  .mc-option-btn.selected{border-color:var(--seal);background:var(--seal-soft);color:var(--seal);}
  .mc-option-btn.correct{border-color:var(--bamboo);background:var(--bamboo-soft);color:var(--bamboo);font-weight:700;animation:popSuccess .3s ease;}
  .mc-option-btn.wrong{border-color:var(--seal) !important;background:var(--seal-soft) !important;color:var(--seal) !important;animation:shakeWrong .45s ease;}
  .mc-opt-prefix{
    width:28px;height:28px;border-radius:50%;background:var(--surface-2);
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  }
  .mc-option-btn.correct .mc-opt-prefix{background:var(--bamboo);color:#fff;}
  .mc-option-btn.wrong .mc-opt-prefix{background:var(--seal);color:#fff;}

  @keyframes shakeWrong{
    10%, 90% { transform: translate3d(-3px, 0, 0); }
    20%, 80% { transform: translate3d(5px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
    40%, 60% { transform: translate3d(7px, 0, 0); }
  }
  @keyframes popSuccess{
    0%{ transform:scale(0.96); } 50%{ transform:scale(1.04); } 100%{ transform:scale(1); }
  }
  .match-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}

  /* 寫字畫布白板：強制 1:1 正方形且水平置中 */
  .draw-board-container{display:flex;flex-direction:column;gap:12px;position:relative;}
  .draw-toolbar{
    display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;
    background:var(--surface-2);border:1px solid var(--grid-line);flex-wrap:wrap;
  }
  .tool-btn{
    padding:6px 10px;border-radius:7px;border:1.5px solid transparent;background:var(--surface);
    font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;
  }
  .tool-btn.active{border-color:var(--seal);background:var(--seal-soft);color:var(--seal);}
  .tool-sep{width:1px;height:20px;background:var(--grid-line);margin:0 2px;}

  .grid-toggle-btn{
    padding:5px 8px;font-size:11.5px;font-weight:600;border-radius:6px;
    border:1px solid var(--grid-line);background:var(--surface);cursor:pointer;
  }
  .grid-toggle-btn.active{background:var(--seal);color:#fff;border-color:var(--seal);}

  .tone-group{display:inline-flex;align-items:center;gap:3px;background:var(--surface);padding:3px 6px;border-radius:8px;border:1px solid var(--grid-line);}
  .tone-btn{
    width:24px;height:24px;padding:0;border:1px solid transparent;border-radius:5px;
    background:transparent;font-size:15px;font-weight:700;line-height:1;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;color:var(--ink);
  }
  .tone-btn:hover{background:var(--seal-soft);color:var(--seal);}

  .color-dot{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .color-dot.active{border-color:var(--ink);transform:scale(1.15);}
  .size-btn{padding:4px 8px;font-size:11px;border-radius:5px;border:1px solid var(--grid-line);background:var(--surface);cursor:pointer;}
  .size-btn.active{background:var(--ink);color:var(--paper);}

  .canvas-stage-wrap{
    position:relative;
    width:100%;
    max-width:520px;
    aspect-ratio:1 / 1;
    margin:0 auto;
    background:#FFFDF8;
    border:2px solid var(--grid-line);
    border-radius:12px;
    overflow:hidden;
  }
  .canvas-stage-wrap.grid-tian{
    background-image:
      linear-gradient(to right, rgba(178,59,50,0.18) 1.5px, transparent 1.5px),
      linear-gradient(to bottom, rgba(178,59,50,0.18) 1.5px, transparent 1.5px);
    background-size:50% 50%;
  }
  .canvas-stage-wrap.grid-jiu{
    background-image:
      linear-gradient(to right, rgba(178,59,50,0.18) 1.5px, transparent 1.5px),
      linear-gradient(to bottom, rgba(178,59,50,0.18) 1.5px, transparent 1.5px);
    background-size:33.333% 33.333%;
  }

  .bg-img-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:1;}
  canvas#paint-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;cursor:crosshair;}
  
  .text-layer{position:absolute;inset:0;z-index:3;pointer-events:none;}
  
  /* 文字物件層：translate(-50%, -50%) 將文字錨點鎖定於中心，支援藍框縮放控制點 */
  .movable-text{
    position:absolute;pointer-events:auto;font-family:"LXGW WenKai TC",serif;
    font-weight:700;line-height:1.2;color:var(--ink);user-select:none;
    padding:6px 10px;border:2px dashed transparent;border-radius:6px;white-space:pre;
    cursor:grab;transform:translate(-50%, -50%);
    transition:border-color .15s ease, background .15s ease;
  }
  .movable-text:hover, .movable-text.active{
    border:2px solid #1E88E5 !important;
    background:rgba(255,255,255,0.92);
    box-shadow:0 2px 10px rgba(30,136,229,0.25);
    cursor:move !important;
  }
  .movable-text.active{
    border-color:var(--seal) !important;
    cursor:grabbing !important;
  }

  /* 縮放控制手把 (藍色框框右下角圓點) */
  .resize-handle{
    display:none;position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;
    background:#1E88E5;border:2px solid #FFFFFF;border-radius:50%;
    cursor:nwse-resize !important;box-shadow:0 1px 4px rgba(0,0,0,0.3);z-index:10;
  }
  .movable-text:hover .resize-handle,
  .movable-text.active .resize-handle{
    display:block;
  }

  .multi-cursor-container{position:absolute;inset:0;pointer-events:none;z-index:99999;overflow:hidden;}
  .peer-cursor{
    position:absolute;pointer-events:none;display:flex;align-items:center;gap:5px;
    transform:translate(-50%,-50%);transition:left .06s linear, top .06s linear;
  }
  .peer-cursor-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.35);}
  .peer-cursor-label{color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,0.2);}

  /* 彈窗設計 */
  .dialog-modal{border:none;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(580px,92vw);max-height:86vh;}
  .dialog-modal::backdrop{background:rgba(20,20,18,0.45);}
  .dialog-head{padding:20px 24px 4px;}
  .dialog-head h2{margin:0 0 2px;font-size:19px;}
  .dialog-body{padding:16px 24px;overflow-y:auto;max-height:56vh;}
  .dialog-foot{padding:14px 24px 22px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--grid-line);margin-top:8px;}
  
  .type-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .type-toggle button{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--grid-line);background:var(--paper);color:var(--ink-soft);font-weight:600;font-size:13px;cursor:pointer;}
  .type-toggle button.active{border-color:var(--seal);color:var(--seal);background:var(--seal-soft);}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:14px 0 5px;}
  input[type="text"], textarea{width:100%;border:1.5px solid var(--grid-line);background:var(--paper);color:var(--ink);border-radius:8px;padding:9px 11px;font-size:14px;}
  .row-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pair-row, .choice-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .pair-row input, .choice-row input[type="text"]{flex:1;}
  .row-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;padding:4px 7px;}
  .add-row-btn{font-size:12.5px;color:var(--seal);background:none;border:none;cursor:pointer;font-weight:600;padding:4px 0;}
  .upload-box{border:2px dashed var(--grid-line);padding:14px;border-radius:10px;text-align:center;cursor:pointer;background:var(--paper);}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand" id="brand-logo" title="點擊返回課程大廳">
      <div class="stamp">好</div>
      <div class="brand-text">
        <h1 id="brand-title">生詞練習台</h1>
        <p id="brand-sub">專案課次大廳</p>
      </div>
    </div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>

  <!-- 專案大廳 (封面首頁) -->
  <div class="lobby-wrap" id="lobby-view">
    <div class="lobby-header">
      <div>
        <h2>📚 我的課次與教學專案</h2>
        <p>點選課次進入互動教學台，或自由新增、編輯與刪除課次</p>
      </div>
      <button type="button" class="btn btn-primary" id="btn-create-project">＋ 新增課次專案</button>
    </div>
    <div class="project-grid" id="project-grid"></div>
  </div>

  <!-- 教學主舞台 -->
  <div class="layout" id="classroom-view" style="display:none;">
    <aside class="sidebar" id="sidebar">
      <button class="btn btn-primary btn-new" id="btn-new" type="button">＋ 新增題目</button>

      <div class="sidebar-excel-group">
        <button type="button" class="btn btn-sm" id="btn-import-excel" style="width:100%; justify-content:center;">📊 匯入 Excel 題庫</button>
        <div style="display:flex; gap:6px;">

<script>
(function(){
  "use strict";

  /* ================== 音效引擎 ================== */
  var audioCtx = null;
  var currentSoundStyle = localStorage.getItem("hanyu_sound_style") || "bell";

  function getAudioContext(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  window.addEventListener("touchstart", function(){ getAudioContext(); }, { once:true });
  window.addEventListener("click", function(){ getAudioContext(); }, { once:true });

  function playCorrectSound(){
    if(currentSoundStyle === "mute") return;
    try{
      var ctx = getAudioContext(), now = ctx.currentTime;
      if(currentSoundStyle === "retro"){
        var osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = "square"; osc.frequency.setValueAtTime(587.33, now); osc.frequency.setValueAtTime(880, now + 0.08);
        g.gain.setValueAtTime(0.12, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(g); g.connect(ctx.destination); osc.start(now); osc.stop(now + 0.28);
      } else if(currentSoundStyle === "marimba"){
        var mOsc = ctx.createOscillator(), mG = ctx.createGain();
        mOsc.type = "sine"; mOsc.frequency.setValueAtTime(784, now);
        mG.gain.setValueAtTime(0.2, now); mG.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        mOsc.connect(mG); mG.connect(ctx.destination); mOsc.start(now); mOsc.stop(now + 0.4);
      } else {
        var osc1 = ctx.createOscillator(), gain1 = ctx.createGain();
        osc1.type = "sine"; osc1.frequency.setValueAtTime(1318.5, now);
        gain1.gain.setValueAtTime(0.18, now); gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc1.connect(gain1); gain1.connect(ctx.destination); osc1.start(now); osc1.stop(now + 0.35);

        var osc2 = ctx.createOscillator(), gain2 = ctx.createGain();
        osc2.type = "sine"; osc2.frequency.setValueAtTime(1567.9, now + 0.1);
        gain2.gain.setValueAtTime(0.22, now + 0.1); gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
        osc2.connect(gain2); gain2.connect(ctx.destination); osc2.start(now + 0.1); osc2.stop(now + 0.55);
      }
    }catch(e){}
  }

  function playWrongSound(){
    if(currentSoundStyle === "mute") return;
    try{
      var ctx = getAudioContext(), now = ctx.currentTime;
      var osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = "triangle"; osc.frequency.setValueAtTime(220, now); osc.frequency.setValueAtTime(185, now + 0.1);
      g.gain.setValueAtTime(0.25, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      osc.connect(g); g.connect(ctx.destination); osc.start(now); osc.stop(now + 0.32);
    }catch(e){}
  }

  function playVictorySound(){
    if(currentSoundStyle === "mute") return;
    try{
      var ctx = getAudioContext(), now = ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach(function(freq, idx){
        var osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = "sine"; osc.frequency.setValueAtTime(freq, now + idx * 0.12);
        g.gain.setValueAtTime(0.2, now + idx * 0.12); g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
        osc.connect(g); g.connect(ctx.destination); osc.start(now + idx * 0.12); osc.stop(now + idx * 0.12 + 0.4);
      });
    }catch(e){}
  }

  /* ================== 寫字板持久狀態（徹底修復顏色與橡皮擦跳回預設） ================== */
  var boardState = {
    tool: "pen",
    color: "#B23B32",
    size: 3,
    fontSize: 36
  };

  /* ================== 專案/課次 資料管理 ================== */
  var PROJECTS_KEY = "hanyu-practice-projects-v3";
  var uid = function(p){ return p + "_" + Math.random().toString(36).slice(2,9); };

  var DEFAULT_PROJECTS = {
    "proj_thai": {
      id: "proj_thai",
      title: "115-1 對泰華語轉銜線上華語課",
      desc: "專為轉銜設計：包含問候生詞配對、語意單選題與生字田字格手寫示範",
      currentSetId: "sample_match",
      sets: {
        sample_match: {
          id:"sample_match", type:"match", title:"生詞配對：你好！（範例）",
          leftLabel:"生詞", rightLabel:"拼音",
          pairs:{
            p1:{id:"p1", left:"你好", right:"nǐ hǎo"},
            p2:{id:"p2", left:"謝謝", right:"xièxie"},
            p3:{id:"p3", left:"再見", right:"zàijiàn"},
            p4:{id:"p4", left:"老師", right:"lǎoshī"},
            p5:{id:"p5", left:"學生", right:"xuéshēng"}
          }
        },
        sample_choice: {
          id:"sample_choice", type:"choice", title:"生詞語意選擇（範例）",
          prompt:"請選出「學生」的拼音與英文意思：",
          choices:{
            c1:{id:"c1", text:"老師 (lǎoshī / Teacher)"},
            c2:{id:"c2", text:"學生 (xuéshēng / Student)"},
            c3:{id:"c3", text:"朋友 (péngyǒu / Friend)"}
          },
          answerId:"c2"
        },
        sample_board: {
          id:"sample_board", type:"board", title:"生字書寫教學：『好』",
          desc:"靠近文字框變成實線即可自由移動，可自訂字號大小並點選聲調。",
          bgImage:"", gridType:"jiu"
        }
      }
    }
  };

  function loadProjects(){
    try{
      var raw = localStorage.getItem(PROJECTS_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Object.keys(parsed).length) return parsed;
      }
    }catch(e){}
    return JSON.parse(JSON.stringify(DEFAULT_PROJECTS));
  }

  var projects = loadProjects();
  function saveProjects(){
    try{ localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects)); }catch(e){}
  }

  var params = new URLSearchParams(location.search);
  var urlRoom = params.get("room");
  var urlRole = params.get("role");
  var urlName = params.get("name");

  var isStudent = (urlRole === "student") || (!!urlRoom && !urlRole);
  var app_ = document.getElementById("app");
  if(isStudent) app_.classList.add("student-mode");

  var activeRoomId = null;
  var roomRole = isStudent ? "student" : "teacher";
  var myName = urlName || (isStudent ? "" : "老師");
  var myId = isStudent ? (localStorage.getItem("hanyu_my_id") || uid("stu")) : "teacher";
  localStorage.setItem("hanyu_my_id", myId);

  var roomData = null;
  var cursorOn = true;
  var activeProjectId = null;
  var editingProjectId = null;

  var CURSOR_COLORS = ["#1E88E5", "#4C7A5E", "#FB8C00", "#8E24AA", "#00897B", "#D81B60"];
  function getColorForStudent(nameOrId, role){
    if(role === "teacher" || nameOrId === "teacher" || nameOrId === "老師" || nameOrId === "👑 老師") return "#B23B32";
    var sum = 0;
    for(var i=0; i<nameOrId.length; i++) sum += nameOrId.charCodeAt(i);
    return CURSOR_COLORS[sum % CURSOR_COLORS.length];
  }

  function inRoom(){ return !!activeRoomId; }
  function getActiveProject(){
    if(inRoom()) return roomData && roomData.project;
    return activeProjectId ? projects[activeProjectId] : null;
  }
  function getSets(){ 
    var proj = getActiveProject();
    return (proj && proj.sets) || {};
  }
  function getCurrentId(){ 
    var proj = getActiveProject();
    return (proj && proj.currentSetId) || Object.keys(getSets())[0];
  }
  function getCurrentSet(){ return getSets()[getCurrentId()] || null; }
  function isOpenForStudent(){ return inRoom() ? (roomData && roomData.isOpen !== undefined ? !!roomData.isOpen : true) : true; }
  
  function canInteract(){ 
    if(!inRoom() || roomRole === "teacher") return true; 
    return isOpenForStudent();
  }

  function getProgress(setId){
    if(inRoom()){
      return (roomData && roomData.sharedProgress && roomData.sharedProgress[setId]) || {};
    }
    var proj = getActiveProject();
    if(proj){
      if(!proj.progress) proj.progress = {};
      if(!proj.progress[setId]) proj.progress[setId] = {};
      return proj.progress[setId];
    }
    return {};
  }

  function writeSets(newSets, newCurrentId){
    if(inRoom()){
      var patch = { "project/sets": newSets };
      if(newCurrentId !== undefined) patch["project/currentSetId"] = newCurrentId;
      update(ref(db, "rooms/" + activeRoomId), patch);
    } else {
      var proj = getActiveProject();
      if(proj){
        proj.sets = newSets;
        if(newCurrentId !== undefined) proj.currentSetId = newCurrentId;
        saveProjects(); renderSidebar(); renderStage();
      }
    }
  }

  function setCurrent(id){
    if(inRoom()){ update(ref(db, "rooms/" + activeRoomId + "/project"), { currentSetId: id }); }
    else { 
      var proj = getActiveProject();
      if(proj){
        proj.currentSetId = id; saveProjects(); renderSidebar(); renderStage(); 
      }
    }
  }

  function writeProgress(setId, patch){
    if(inRoom()){ 
      update(ref(db, "rooms/" + activeRoomId + "/sharedProgress/" + setId), patch); 
    } else { 
      Object.assign(getProgress(setId), patch); 
      saveProjects(); 
      renderStage(); 
    }
  }

  /* ================== 大廳／主舞台 切換邏輯 ================== */
  var lobbyView = document.getElementById("lobby-view");
  var classroomView = document.getElementById("classroom-view");

  function showLobby(){
    activeProjectId = null;
    lobbyView.style.display = "block";
    classroomView.style.display = "none";
    document.getElementById("brand-sub").textContent = "專案課次大廳";
    renderLobbyGrid();
    renderTopbar();
  }

  function openProject(projId){
    activeProjectId = projId;
    var proj = projects[projId];
    lobbyView.style.display = "none";
    classroomView.style.display = "grid";
    document.getElementById("brand-sub").textContent = proj.title;
    renderTopbar();
    renderSidebar();
    renderStage();
  }

  document.getElementById("brand-logo").onclick = function(){
    if(isStudent) return;
    if(inRoom()){
      if(confirm("目前正在進行線上連線，確定要結束連線並返回課次大廳嗎？")){
        leaveRoom();
        showLobby();
      }
    } else {
      showLobby();
    }
  };

  /* 渲染專案卡片清單（封面） */
  var projectGrid = document.getElementById("project-grid");
  function renderLobbyGrid(){
    projectGrid.innerHTML = "";
    var keys = Object.keys(projects);
    keys.forEach(function(pid){
      var proj = projects[pid];
      var count = Object.keys(proj.sets || {}).length;

      var card = document.createElement("div");
      card.className = "project-card";
      card.innerHTML = `
        <div>
          <div class="project-card-head">
            <h3 class="project-title zh">${proj.title}</h3>
          </div>
          <p class="project-desc">${proj.desc || "點擊進入開始備課或線上教學練習"}</p>
        </div>
        <div class="project-card-foot">
          <span class="project-badge">📦 ${count} 組練習</span>
          <div class="project-actions-btns">
            <button type="button" class="btn btn-sm btn-ghost btn-edit-proj" title="編輯課次名稱">✏️</button>
            <button type="button" class="btn btn-sm btn-ghost btn-del-proj" title="刪除課次" style="color:var(--seal);">🗑️</button>
            <button type="button" class="btn btn-sm btn-primary btn-enter-proj">進入上課 →</button>
          </div>
        </div>
      `;

      card.querySelector(".btn-enter-proj").onclick = function(){ openProject(pid); };
      card.querySelector(".btn-edit-proj").onclick = function(e){
        e.stopPropagation();
        openProjectDialog(pid);
      };
      card.querySelector(".btn-del-proj").onclick = function(e){
        e.stopPropagation();
        if(Object.keys(projects).length <= 1){
          alert("至少要保留一個課次專案喔！");
          return;
        }
        if(confirm(`確定要刪除「${proj.title}」專案嗎？裡面的所有題目將被清除。`)){
          delete projects[pid];
          saveProjects();
          renderLobbyGrid();
        }
      };

      projectGrid.appendChild(card);
    });
  }

  /* 課次專案新增／編輯彈窗 */
  var projectDialog = document.getElementById("project-dialog");
  function openProjectDialog(editId){
    editingProjectId = editId || null;
    document.getElementById("project-dialog-title").textContent = editingProjectId ? "編輯課次專案" : "新增課次專案";
    if(editingProjectId){
      var p = projects[editingProjectId];
      document.getElementById("f-proj-title").value = p.title;
      document.getElementById("f-proj-desc").value = p.desc || "";
    } else {
      document.getElementById("f-proj-title").value = "";
      document.getElementById("f-proj-desc").value = "";
    }
    projectDialog.showModal();
  }

  document.getElementById("btn-create-project").onclick = function(){ openProjectDialog(null); };
  document.getElementById("btn-cancel-project").onclick = function(){ projectDialog.close(); };

  document.getElementById("project-form").onsubmit = function(e){
    e.preventDefault();
    var title = document.getElementById("f-proj-title").value.trim();
    var desc = document.getElementById("f-proj-desc").value.trim();
    if(!title) return;

    if(editingProjectId){
      projects[editingProjectId].title = title;
      projects[editingProjectId].desc = desc;
    } else {
      var newId = uid("proj");
      projects[newId] = {
        id: newId, title: title, desc: desc,
        currentSetId: "sample_match",
        sets: JSON.parse(JSON.stringify(DEFAULT_PROJECTS["proj_thai"].sets))
      };
    }
    saveProjects();
    projectDialog.close();
    renderLobbyGrid();
  };

  /* 頂部控制列 */
  var topbarActions = document.getElementById("topbar-actions");
  function renderTopbar(){
    topbarActions.innerHTML = "";

    if(!isStudent && activeProjectId && !inRoom()){
      var backBtn = document.createElement("button");
      backBtn.className = "btn btn-sm btn-ghost";
      backBtn.textContent = "◀ 課次大廳";
      backBtn.onclick = showLobby;
      topbarActions.appendChild(backBtn);
    }

    if(inRoom()){
      var c2 = document.createElement("div"); c2.className = "room-cluster";
      var onlineCount = 0;
      if(roomData && roomData.presence){
        Object.keys(roomData.presence).forEach(function(k){
          if(roomData.presence[k].online) onlineCount++;
        });
      }
      
      c2.innerHTML = `
        <span class="room-code">房間 <b>${activeRoomId}</b></span>
        <span class="presence-dot ${onlineCount > 1 ? 'online' : ''}"></span>
        <span style="font-size:12px;">${isStudent ? `已加入（${myName}）` : `在線：${onlineCount} 人`}</span>
      `;

      if(!isStudent){
        var toggleOpen = document.createElement("label");
        toggleOpen.className = "toggle" + (isOpenForStudent() ? " on" : "");
        toggleOpen.innerHTML = '<span class="toggle-track"></span><span>' + (isOpenForStudent() ? "開放作答中" : "鎖定作答中") + '</span>';
        toggleOpen.onclick = function(){
          update(ref(db, "rooms/" + activeRoomId), { isOpen: !isOpenForStudent() });
        };
        c2.appendChild(toggleOpen);

        var toggleCursor = document.createElement("label");
        toggleCursor.className = "toggle" + (cursorOn ? " on" : "");
        toggleCursor.innerHTML = '<span class="toggle-track"></span><span>' + (cursorOn ? "指標分享中" : "指標已關閉") + '</span>';
        toggleCursor.onclick = function(){
          cursorOn = !cursorOn;
          renderTopbar();
        };
        c2.appendChild(toggleCursor);
      }
      topbarActions.appendChild(c2);

      if(!isStudent){
        var shareBtn = document.createElement("button"); shareBtn.className = "btn btn-sm btn-primary"; shareBtn.textContent = "🔗 複製學生連結";
        shareBtn.onclick = function(){
          var link = location.origin + location.pathname + "?room=" + activeRoomId + "&role=student";
          navigator.clipboard.writeText(link).then(function(){ alert("✅ 學生連結已複製！傳給學生點開即可加入這課。"); });
        };
        topbarActions.appendChild(shareBtn);

        var leaveBtn = document.createElement("button"); leaveBtn.className = "btn btn-sm btn-ghost"; leaveBtn.textContent = "結束連線";
        leaveBtn.onclick = leaveRoom;
        topbarActions.appendChild(leaveBtn);
      }
    } else if(activeProjectId){
      var btn = document.createElement("button"); btn.className = "btn btn-primary"; btn.textContent = "🔗 開新房間（上這課）";
      btn.onclick = createRoom;
      topbarActions.appendChild(btn);
    }

    if(!isStudent){
      var setBtn = document.createElement("button"); setBtn.className = "btn btn-sm btn-ghost"; setBtn.textContent = "⚙️ 設定";
      setBtn.onclick = function(){ document.getElementById("settings-dialog").showModal(); };
      topbarActions.appendChild(setBtn);
    }
  }

  async function createRoom(){
    var rId = String(Math.floor(1000 + Math.random() * 9000));
    activeRoomId = rId;
    var currentProj = projects[activeProjectId];

    await set(ref(db, "rooms/" + rId), {
      project: currentProj,
      sharedProgress: {},
      isOpen: true,
      presence: { teacher: { online:true, name:"老師" } }
    });
    attachPresence(rId, "teacher", "老師");
    startRoom(rId, "teacher");
    history.replaceState(null, "", "?room=" + rId);
    renderTopbar();
    var link = location.origin + location.pathname + "?room=" + rId + "&role=student";
    navigator.clipboard.writeText(link).then(function(){ alert("✅ 房間已開好！\n學生連結已複製到剪貼簿，傳給學生點開即可加入。"); });
  }

  function leaveRoom(){
    if(activeRoomId){
      set(ref(db, "rooms/" + activeRoomId + "/presence/" + myId), { online: false });
    }
    activeRoomId = null; roomData = null;
    history.replaceState(null, "", location.pathname);
    renderTopbar();
    if(activeProjectId) {
      renderSidebar(); renderStage();
    } else {
      showLobby();
    }
  }

  function attachPresence(rId, id, name){
    var pRef = ref(db, "rooms/" + rId + "/presence/" + id);
    set(pRef, { online: true, name: name });
    onDisconnect(pRef).set({ online: false, name: name });
  }

  function startRoom(rId, role){
    activeRoomId = rId; roomRole = role;
    onValue(ref(db, "rooms/" + rId), function(snap){
      roomData = snap.val() || {};
      if(isStudent){
        lobbyView.style.display = "none";
        classroomView.style.display = "grid";
        if(roomData.project){
          document.getElementById("brand-sub").textContent = roomData.project.title;
        }
      }
      renderTopbar(); renderSidebar(); renderStage();
    });
    onValue(ref(db, "roomCursors/" + rId), function(snap){
      renderMultiCursors(snap.val());
    });
  }

  /* 側欄 */
  var setListEl = document.getElementById("set-list");
  function renderSidebar(){
    if(isStudent) return;
    setListEl.innerHTML = "";
    var sets = getSets();
    Object.keys(sets).forEach(function(id){
      var s = sets[id];
      var card = document.createElement("div");
      card.className = "set-card" + (id === getCurrentId() ? " active" : "");
      var tag = s.type === "match" ? "連連看" : (s.type === "choice" ? "選擇題" : (s.type === "circle" ? "圈出來" : "寫字板"));
      card.innerHTML = `<div class="set-card-top"><span class="set-card-title">${s.title}</span><span class="badge">${tag}</span></div>`;
      var del = document.createElement("button"); del.className = "set-card-del"; del.type = "button"; del.textContent = "刪除";
      del.onclick = function(ev){
        ev.stopPropagation();
        var keys = Object.keys(sets);
        if(keys.length <= 1) return;
        var newSets = Object.assign({}, sets);
        delete newSets[id];
        var newCur = getCurrentId() === id ? Object.keys(newSets)[0] : undefined;
        writeSets(newSets, newCur);
      };
      card.appendChild(del);
      card.onclick = function(){ setCurrent(id); };
      setListEl.appendChild(card);
    });
  }

  /* 舞台主渲染 */
  var stageEl = document.getElementById("stage");
  function renderStage(){
    var s = getCurrentSet();
    stageEl.innerHTML = "";
    if(!s) return;

    var head = document.createElement("div"); head.className = "stage-head";
    head.innerHTML = '<div><h2 class="stage-title zh">' + s.title + '</h2><p class="stage-sub">' + (s.desc || "1對1 即時互動練習") + '</p></div>';
    
    if(!isStudent){
      var actWrap = document.createElement("div"); actWrap.className = "stage-actions";
      var resetBtn = document.createElement("button"); resetBtn.className = "btn btn-sm"; resetBtn.textContent = "🔄 重新開始";
      resetBtn.onclick = function(){
        writeProgress(s.id, { matched:{}, selected:{}, choicePick:null, revealed:false, strokes:[], texts:[], lastWrong:null });
      };
      actWrap.appendChild(resetBtn);

      if(s.type === "circle" || s.type === "choice"){
        var revBtn = document.createElement("button"); revBtn.className = "btn btn-sm btn-primary"; revBtn.textContent = "公布答案";
        revBtn.onclick = function(){
          writeProgress(s.id, { revealed: true });
        };
        actWrap.appendChild(revBtn);
      }
      head.appendChild(actWrap);
    }

    stageEl.appendChild(head);

    var cursorBox = document.createElement("div");
    cursorBox.className = "multi-cursor-container";
    cursorBox.id = "multi-cursor-box";
    stageEl.appendChild(cursorBox);

    if(s.type === "match") renderMatchBoard(s);
    else if(s.type === "choice") renderChoiceBoard(s);
    else if(s.type === "circle") renderCircleBoard(s);
    else if(s.type === "board") renderDrawBoard(s);
  }

  /* 選擇題（含雙向答錯即時廣播） */
  function renderChoiceBoard(s){
    var progress = getProgress(s.id);
    var interactive = canInteract();
    var currentPick = progress.choicePick || null;
    var isRevealed = !!progress.revealed;

    var wrap = document.createElement("div");
    wrap.innerHTML = `<p class="circle-prompt zh">${s.prompt || s.title}</p>`;

    var cBox = document.createElement("div"); 
    cBox.className = "mc-choices-container";

    var keys = Object.keys(s.choices || {}).sort();
    var letters = ["A", "B", "C", "D", "E", "F"];

    keys.forEach(function(cid, idx){
      var c = s.choices[cid];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mc-option-btn";
      btn.dataset.cid = cid;

      var isThisPicked = currentPick === cid;
      var isCorrect = s.answerId === cid;

      if(isRevealed){
        if(isCorrect) btn.classList.add("correct");
        else if(isThisPicked && !isCorrect) btn.classList.add("wrong");
        btn.disabled = true;
      } else if(isThisPicked){
        btn.classList.add("selected");
      }

      if(!interactive) btn.disabled = true;

      btn.innerHTML = `
        <span class="mc-opt-prefix">${letters[idx] || (idx+1)}</span>
        <span>${c.text}</span>
      `;

      btn.onclick = function(){
        if(!interactive || isRevealed) return;
        if(isCorrect){
          playCorrectSound();
          writeProgress(s.id, { choicePick: cid, lastChoiceWrong: null });
        } else {
          playWrongSound();
          writeProgress(s.id, { 
            choicePick: cid, 
            lastChoiceWrong: { cid: cid, t: Date.now(), who: myName } 
          });
        }
      };

      cBox.appendChild(btn);
    });

    wrap.appendChild(cBox);

    if(isRevealed){
      var note = document.createElement("p");
      note.style.fontSize = "13px"; note.style.color = "var(--bamboo)"; note.style.marginTop = "14px"; note.style.fontWeight = "700";
      note.textContent = "✅ 正確答案已標示為綠色。";
      wrap.appendChild(note);
    }

    stageEl.appendChild(wrap);

    var lastChoiceWrong = progress.lastChoiceWrong;
    if(lastChoiceWrong && lastChoiceWrong.t && (Date.now() - lastChoiceWrong.t < 1200)){
      var wBtn = cBox.querySelector(`.mc-option-btn[data-cid="${lastChoiceWrong.cid}"]`);
      if(wBtn && !wBtn.classList.contains("wrong")){
        wBtn.classList.add("wrong");
        playWrongSound();
        setTimeout(function(){
          if(wBtn) wBtn.classList.remove("wrong");
        }, 500);
      }
    }
  }

  /* ================= 寫字板功能（精準中心錨點對齊 + 下拉選單選字號 + 藍框拉動縮放） ================= */
  function renderDrawBoard(s){
    var progress = getProgress(s.id);
    var strokes = progress.strokes || [];
    var texts = progress.texts || [];
    var currentGrid = progress.gridType || s.gridType || "jiu";

    var wrap = document.createElement("div"); wrap.className = "draw-board-container";

    var toolbar = document.createElement("div"); toolbar.className = "draw-toolbar";
    toolbar.innerHTML = `
      <button type="button" class="tool-btn ${boardState.tool==='pen'?'active':''}" data-tool="pen">✏️ 畫筆</button>
      <button type="button" class="tool-btn ${boardState.tool==='text'?'active':''}" data-tool="text">🔤 打字</button>
      <button type="button" class="tool-btn ${boardState.tool==='stroke-eraser'?'active':''}" data-tool="stroke-eraser" title="點選整條筆畫刪除（持續有效）">🪄 筆畫擦</button>
      <button type="button" class="tool-btn ${boardState.tool==='pixel-eraser'?'active':''}" data-tool="pixel-eraser" title="局部橡皮擦">🧽 局部擦</button>
      <div class="tool-sep"></div>

      <!-- 字號選單 (免自己打字輸入) -->
      <span style="font-size:12px;font-weight:700;color:var(--ink);">字號:</span>
      <select class="board-font-select" style="padding:4px 6px;border-radius:6px;border:1px solid var(--grid-line);font-size:12px;background:var(--surface);cursor:pointer;">
        <option value="24" ${boardState.fontSize===24?'selected':''}>24 號</option>
        <option value="32" ${boardState.fontSize===32?'selected':''}>32 號</option>
        <option value="40" ${boardState.fontSize===40?'selected':''}>40 號</option>
        <option value="52" ${boardState.fontSize===52?'selected':''}>52 號</option>
        <option value="68" ${boardState.fontSize===68?'selected':''}>68 號</option>
        <option value="84" ${boardState.fontSize===84?'selected':''}>84 號</option>
      </select>
      <div class="tool-sep"></div>

      <span style="font-size:12px;font-weight:700;color:var(--ink);">格線:</span>
      <button type="button" class="grid-toggle-btn ${currentGrid==='none'?'active':''}" data-grid="none">無格</button>
      <button type="button" class="grid-toggle-btn ${currentGrid==='tian'?'active':''}" data-grid="tian">田字格</button>
      <button type="button" class="grid-toggle-btn ${currentGrid==='jiu'?'active':''}" data-grid="jiu">九宮格</button>
      <div class="tool-sep"></div>
      
      <span style="font-size:12px;font-weight:700;color:var(--seal);">聲調:</span>
      <div class="tone-group">
        <button type="button" class="tone-btn" data-tone="ˉ">ˉ</button>
        <button type="button" class="tone-btn" data-tone="ˊ">ˊ</button>
        <button type="button" class="tone-btn" data-tone="ˇ">ˇ</button>
        <button type="button" class="tone-btn" data-tone="ˋ">ˋ</button>
        <button type="button" class="tone-btn" data-tone="˙">˙</button>
      </div>
      <div class="tool-sep"></div>

      <span style="font-size:12px;color:var(--ink-soft);">顏色:</span>
      <div class="color-dot ${boardState.color==='#B23B32'?'active':''}" data-color="#B23B32" style="background:#B23B32;"></div>
      <div class="color-dot ${boardState.color==='#2A333C'?'active':''}" data-color="#2A333C" style="background:#2A333C;"></div>
      <div class="color-dot ${boardState.color==='#1E88E5'?'active':''}" data-color="#1E88E5" style="background:#1E88E5;"></div>
      <div class="color-dot ${boardState.color==='#4C7A5E'?'active':''}" data-color="#4C7A5E" style="background:#4C7A5E;"></div>
      <div class="color-dot ${boardState.color==='#FB8C00'?'active':''}" data-color="#FB8C00" style="background:#FB8C00;"></div>
      <div class="tool-sep"></div>
      
      <span style="font-size:12px;color:var(--ink-soft);">粗細:</span>
      <button type="button" class="size-btn ${boardState.size===3?'active':''}" data-size="3">細</button>
      <button type="button" class="size-btn ${boardState.size===6?'active':''}" data-size="6">中</button>
      <button type="button" class="size-btn ${boardState.size===12?'active':''}" data-size="12">粗</button>
      <div class="tool-sep"></div>
      <button type="button" class="btn btn-sm" id="btn-clear-draw" style="color:var(--seal);">🗑️ 清空</button>
    `;
    wrap.appendChild(toolbar);

    var cWrap = document.createElement("div"); 
    cWrap.className = "canvas-stage-wrap " + (currentGrid === 'tian' ? 'grid-tian' : (currentGrid === 'jiu' ? 'grid-jiu' : ''));
    if(s.bgImage){
      var img = document.createElement("img"); img.className = "bg-img-layer"; img.src = s.bgImage;
      cWrap.appendChild(img);
    }
    var canvas = document.createElement("canvas"); canvas.id = "paint-canvas";
    var textLayer = document.createElement("div"); textLayer.className = "text-layer";
    cWrap.appendChild(canvas);
    cWrap.appendChild(textLayer);
    wrap.appendChild(cWrap);
    stageEl.appendChild(wrap);

    var ctx = canvas.getContext("2d");
    var isDrawing = false;
    var currentPath = [];
    var activeSelectedTextId = null;

    function getScaleRatio(){
      var w = cWrap.clientWidth || canvas.width || 500;
      return Math.max(0.4, w / 500);
    }

    function resizeCanvas(){
      var r = cWrap.getBoundingClientRect();
      if(r.width > 0 && r.height > 0){
        canvas.width = r.width; canvas.height = r.height;
        redrawStrokes();
        renderTexts();
      }
    }
    requestAnimationFrame(resizeCanvas);
    window.addEventListener("resize", resizeCanvas);

    function redrawStrokes(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      var scale = getScaleRatio();
      strokes.forEach(function(st){
        if(!st.points || st.points.length < 2) return;
        ctx.save();
        if(st.isEraser){
          ctx.globalCompositeOperation = "destination-out";
          ctx.lineWidth = Math.max(2, st.size * 2.5 * scale);
        } else {
          ctx.globalCompositeOperation = "source-over";
          ctx.strokeStyle = st.color;
          ctx.lineWidth = Math.max(1, st.size * scale);
        }
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(st.points[0].x * canvas.width / 100, st.points[0].y * canvas.height / 100);
        for(var i=1; i<st.points.length; i++){
          ctx.lineTo(st.points[i].x * canvas.width / 100, st.points[i].y * canvas.height / 100);
        }
        ctx.stroke();
        ctx.restore();
      });
    }

    function renderTexts(){
      textLayer.innerHTML = "";
      var scale = getScaleRatio();

      texts.forEach(function(t, idx){
        var div = document.createElement("div");
        div.className = "movable-text" + (t.id === activeSelectedTextId ? " active" : "");
        div.style.left = t.x + "%";
        div.style.top = t.y + "%";
        div.style.color = t.color || "#2A333C";
        
        var baseSize = t.fontSize || 36;
        div.style.fontSize = Math.round(baseSize * scale) + "px";

        div.innerHTML = `
          <span class="text-content">${t.text}</span>
          <div class="resize-handle" title="按住拖動縮放字體"></div>
        `;

        // 縮放控制：拉動右下角藍點放大/縮小字體
        var handle = div.querySelector(".resize-handle");
        handle.onmousedown = function(e){
          e.stopPropagation();
          e.preventDefault();
          var startSize = t.fontSize || 36;
          var centerRect = div.getBoundingClientRect();
          var centerX = centerRect.left + centerRect.width / 2;
          var centerY = centerRect.top + centerRect.height / 2;
          var startDist = Math.hypot(e.clientX - centerX, e.clientY - centerY) || 1;

          function onResizeMove(ev){
            var currentDist = Math.hypot(ev.clientX - centerX, ev.clientY - centerY);
            var ratio = currentDist / startDist;
            var newSize = Math.max(16, Math.min(120, Math.round(startSize * ratio)));
            t.fontSize = newSize;
            div.style.fontSize = Math.round(newSize * scale) + "px";
            if(fontSelect) fontSelect.value = String(newSize);
          }

          function onResizeUp(){
            window.removeEventListener("mousemove", onResizeMove);
            window.removeEventListener("mouseup", onResizeUp);
            writeProgress(s.id, { texts: texts });
          }

          window.addEventListener("mousemove", onResizeMove);
          window.addEventListener("mouseup", onResizeUp);
        };

        // 移動控制：靠近藍框按住任意處直接平移
        div.onmousedown = function(e){
          e.stopPropagation();

          if(boardState.tool === "stroke-eraser"){
            texts.splice(idx, 1);
            writeProgress(s.id, { texts: texts });
            return;
          }

          activeSelectedTextId = t.id;
          div.classList.add("active");
          if(fontSelect) fontSelect.value = String(t.fontSize || 36);

          var startX = e.clientX, startY = e.clientY;
          var origX = t.x, origY = t.y;
          var rect = cWrap.getBoundingClientRect();

          function onMove(ev){
            var dx = (ev.clientX - startX) / rect.width * 100;
            var dy = (ev.clientY - startY) / rect.height * 100;
            t.x = Math.max(5, Math.min(95, origX + dx));
            t.y = Math.max(5, Math.min(95, origY + dy));
            div.style.left = t.x + "%";
            div.style.top = t.y + "%";
          }

          function onUp(){
            div.classList.remove("active");
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            writeProgress(s.id, { texts: texts });
          }

          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        };

        textLayer.appendChild(div);
      });
    }

    function getPos(e){
      var r = cWrap.getBoundingClientRect();
      var cx = e.touches ? e.touches[0].clientX : e.clientX;
      var cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - r.left) / r.width * 100,
        y: (cy - r.top) / r.height * 100
      };
    }

    function checkStrokeHit(p){
      for(var i = strokes.length - 1; i >= 0; i--){
        var pts = strokes[i].points;
        for(var j=0; j<pts.length; j++){
          var dist = Math.hypot(pts[j].x - p.x, pts[j].y - p.y);
          if(dist < 3.5){
            strokes.splice(i, 1);
            writeProgress(s.id, { strokes: strokes });
            return true;
          }
        }
      }
      return false;
    }

    canvas.onmousedown = function(e){
      if(!canInteract()) return;
      var p = getPos(e);
      activeSelectedTextId = null;

      if(boardState.tool === "stroke-eraser"){
        checkStrokeHit(p);
        return;
      }
      if(boardState.tool === "text"){
        var txt = prompt("請輸入文字內容（漢字或拼音）：");
        if(txt && txt.trim()){
          texts.push({ 
            id: uid("t"), 
            text: txt.trim(), 
            x: p.x, 
            y: p.y, 
            color: boardState.color, 
            fontSize: boardState.fontSize || 36 
          });
          writeProgress(s.id, { texts: texts });
        }
        return;
      }

      isDrawing = true;
      currentPath = [p];
    };

    window.onmousemove = function(e){
      if(!isDrawing) return;
      var p = getPos(e);
      currentPath.push(p);

      var scale = getScaleRatio();
      ctx.save();
      if(boardState.tool === "pixel-eraser"){
        ctx.globalCompositeOperation = "destination-out";
        ctx.lineWidth = Math.max(2, boardState.size * 2.5 * scale);
      } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = boardState.color;
        ctx.lineWidth = Math.max(1, boardState.size * scale);
      }
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath();
      var pts = currentPath;
      if(pts.length >= 2){
        ctx.moveTo(pts[pts.length-2].x * canvas.width / 100, pts[pts.length-2].y * canvas.height / 100);

  /* 連連看：強制一致排序、雙向即時同步答錯狀態 */
  function renderMatchBoard(s){
    var progress = getProgress(s.id);
    var matched = progress.matched || {};
    var interactive = canInteract();

    var wrap = document.createElement("div"); wrap.className = "match-board";
    var svg = document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.setAttribute("class","match-svg");
    wrap.appendChild(svg);
    var cols = document.createElement("div"); cols.className = "match-cols";
    var lCol = document.createElement("div"); lCol.className = "match-col";
    var rCol = document.createElement("div"); rCol.className = "match-col";
    lCol.innerHTML = '<div class="match-col-label">' + (s.leftLabel || "項目一") + '</div>';
    rCol.innerHTML = '<div class="match-col-label">' + (s.rightLabel || "項目二") + '</div>';

    var pIds = Object.keys(s.pairs).sort();
    var rOrder = pIds.slice().sort();

    var selL = null, selR = null;

    pIds.forEach(function(pid){
      var p = s.pairs[pid];
      var btn = document.createElement("button"); btn.type="button"; 
      btn.className = "match-item zh" + (matched[pid] ? " matched" : "");
      btn.textContent = p.left; 
      btn.dataset.id = pid; btn.dataset.side = "left";
      if(matched[pid] || !interactive) btn.disabled = true;
      btn.onclick = function(){
        if(matched[pid] || !interactive) return;
        lCol.querySelectorAll(".match-item").forEach(function(el){ el.classList.remove("selected"); });
        btn.classList.add("selected");
        selL = pid; checkMatch();
      };
      lCol.appendChild(btn);
    });

    rOrder.forEach(function(pid){
      var p = s.pairs[pid];
      var btn = document.createElement("button"); btn.type="button"; 
      btn.className = "match-item" + (matched[pid] ? " matched" : "");
      btn.textContent = p.right; 
      btn.dataset.id = pid; btn.dataset.side = "right";
      if(matched[pid] || !interactive) btn.disabled = true;
      btn.onclick = function(){
        if(matched[pid] || !interactive) return;
        rCol.querySelectorAll(".match-item").forEach(function(el){ el.classList.remove("selected"); });
        btn.classList.add("selected");
        selR = pid; checkMatch();
      };
      rCol.appendChild(btn);
    });

    function checkMatch(){
      if(selL && selR){
        var leftBtn = lCol.querySelector(`.match-item[data-id="${selL}"]`);
        var rightBtn = rCol.querySelector(`.match-item[data-id="${selR}"]`);

        if(selL === selR){
          playCorrectSound();
          matched[selL] = true;
          writeProgress(s.id, { matched: matched, lastWrong: null });

          if(Object.keys(matched).length === pIds.length){
            setTimeout(playVictorySound, 400);
          }
        } else {
          playWrongSound();
          writeProgress(s.id, { 
            lastWrong: { left: selL, right: selR, t: Date.now(), who: myName } 
          });
        }
        selL = null; selR = null;
      }
    }

    cols.appendChild(lCol); cols.appendChild(rCol);
    wrap.appendChild(cols);
    stageEl.appendChild(wrap);

    var lastWrong = progress.lastWrong;
    if(lastWrong && lastWrong.t && (Date.now() - lastWrong.t < 1200)){
      var wLeft = lCol.querySelector(`.match-item[data-id="${lastWrong.left}"]`);
      var wRight = rCol.querySelector(`.match-item[data-id="${lastWrong.right}"]`);
      if(wLeft && wRight && !wLeft.classList.contains("wrong")){
        wLeft.classList.add("wrong");
        wRight.classList.add("wrong");
        playWrongSound();
        setTimeout(function(){
          if(wLeft) wLeft.classList.remove("wrong", "selected");
          if(wRight) wRight.classList.remove("wrong", "selected");
        }, 500);
      }
    }

    function drawLines(){
      var rect = wrap.getBoundingClientRect();
      svg.setAttribute("viewBox","0 0 "+rect.width+" "+rect.height);
      svg.innerHTML = "";
      Object.keys(matched).forEach(function(pid){
        var l = lCol.querySelector(`.match-item[data-id="${pid}"]`);
        var r = rCol.querySelector(`.match-item[data-id="${pid}"]`);
        if(!l || !r) return;
        var lr = l.getBoundingClientRect(), rr = r.getBoundingClientRect();
        var x1 = lr.right - rect.left, y1 = lr.top + lr.height/2 - rect.top;
        var x2 = rr.left - rect.left, y2 = rr.top + rr.height/2 - rect.top;
        var mx = (x1+x2)/2;
        var path = document.createElementNS("http://www.w3.org/2000/svg","path");
        path.setAttribute("d", "M"+x1+","+y1+" C "+mx+","+y1+" "+mx+","+y2+" "+x2+","+y2);
        path.setAttribute("stroke", "#4C7A5E"); path.setAttribute("stroke-width","3");
        path.setAttribute("fill","none"); path.setAttribute("stroke-linecap","round");
        svg.appendChild(path);
      });
    }
    requestAnimationFrame(drawLines);
    window.addEventListener("resize", drawLines);
  }

  /* 圈選題 */
  function renderCircleBoard(s){
    var progress = getProgress(s.id);
    var selected = progress.selected || {};
    var interactive = canInteract();
    var correctIds = s.correctIds || [];

    var wrap = document.createElement("div");
    wrap.innerHTML = '<p class="circle-prompt zh">' + s.prompt + '</p>';
    var cBox = document.createElement("div"); cBox.className = "circle-choices";

    Object.keys(s.choices).forEach(function(cid){
      var c = s.choices[cid];
      var btn = document.createElement("button"); 
      var isSel = !!selected[cid];
      var isCorrect = correctIds.indexOf(cid) !== -1;

      btn.className = "circle-chip";
      btn.textContent = c.text;

      if(progress.revealed){
        if(isCorrect && isSel) btn.classList.add("correct");
        else if(isCorrect && !isSel) btn.classList.add("missed");
        else if(!isCorrect && isSel) btn.classList.add("selected-wrong");
        btn.disabled = true;
      } else {
        if(isSel) btn.classList.add("selected");
        if(!interactive) btn.disabled = true;
      }

      btn.onclick = function(){
        if(!interactive || progress.revealed) return;
        selected[cid] = !selected[cid];
        if(selected[cid]){
          if(isCorrect) playCorrectSound();
          else playWrongSound();
        }
        writeProgress(s.id, { selected: selected });
      };
      cBox.appendChild(btn);
    });
    wrap.appendChild(cBox);

    if(progress.revealed){
      var note = document.createElement("p");
      note.style.fontSize = "13px"; note.style.color = "var(--ink-soft)"; note.style.marginTop = "14px";
      note.textContent = "綠色實線＝答對；綠色虛線＝漏選答案；劃線＝選錯。";
      wrap.appendChild(note);
    }

    stageEl.appendChild(wrap);
  }

  /* Excel 批次操作 */
  var excelInput = document.getElementById("excel-file-input");
  document.getElementById("btn-import-excel").onclick = function(){ excelInput.click(); };

  excelInput.onchange = function(e){
    var file = e.target.files[0];
    if(!file) return;

    var reader = new FileReader();
    reader.onload = function(evt){
      try {
        var data = new Uint8Array(evt.target.result);
        var wb = XLSX.read(data, { type: 'array' });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws);

        if(!rows || rows.length === 0){ alert("Excel 檔案內沒有資料！"); return; }

        var newSets = Object.assign({}, getSets());
        var grouped = {};

        rows.forEach(function(row){
          var title = row["題目名稱"] || row["Title"] || "未命名題目";
          var type = (row["題型"] || row["Type"] || "match").toLowerCase();
          if(!grouped[title]){
            grouped[title] = { title: title, type: type, items: [], desc: row["說明"] || row["Desc"] || "" };
          }
          grouped[title].items.push(row);
        });

        Object.keys(grouped).forEach(function(tKey){
          var g = grouped[tKey];
          var newId = uid("set");

          if(g.type === "match"){
            var pairs = {};
            g.items.forEach(function(it, idx){
              var pid = "p" + (idx + 1);
              var l = it["左欄生詞"] || it["Left"] || "";
              var r = it["右欄拼音或意思"] || it["Right"] || "";
              if(l && r) pairs[pid] = { id: pid, left: String(l), right: String(r) };
            });
            newSets[newId] = {
              id: newId, type: "match", title: g.title,
              leftLabel: "生詞", rightLabel: "拼音／意思",
              pairs: pairs
            };
          } else if(g.type === "choice"){
            g.items.forEach(function(it, idx){
              var subId = uid("set");
              var prompt = it["題目說明"] || it["Prompt"] || g.title;
              var rawChoices = String(it["選項(逗號分開)"] || it["Choices"] || "").split(/[,，、]/);
              var answer = String(it["正確答案"] || it["Answer"] || "").trim();
              var choices = {}, answerId = null;

              rawChoices.forEach(function(cText, cIdx){
                var cid = "c" + (cIdx + 1);
                var trimTxt = cText.trim();
                if(trimTxt){
                  choices[cid] = { id: cid, text: trimTxt };
                  if(trimTxt === answer) answerId = cid;
                }
              });

              if(!answerId && Object.keys(choices).length) answerId = Object.keys(choices)[0];

              newSets[subId] = {
                id: subId, type: "choice",
                title: g.title + (g.items.length > 1 ? " (" + (idx+1) + ")" : ""),
                prompt: prompt, choices: choices, answerId: answerId
              };
            });
          } else if(g.type === "circle"){
            g.items.forEach(function(it, idx){
              var subId = uid("set");
              var prompt = it["題目說明"] || it["Prompt"] || g.title;
              var rawChoices = String(it["選項(逗號分開)"] || it["Choices"] || "").split(/[,，、]/);
              var answer = String(it["正確答案"] || it["Answer"] || "").trim();
              var choices = {};
              var correctIds = [];

              rawChoices.forEach(function(cText, cIdx){
                var cid = "c" + (cIdx + 1);
                var trimTxt = cText.trim();
                if(trimTxt){
                  choices[cid] = { id: cid, text: trimTxt };
                  if(trimTxt === answer) correctIds.push(cid);
                }
              });

              newSets[subId] = {
                id: subId, type: "circle",
                title: g.title + (g.items.length > 1 ? " (" + (idx+1) + ")" : ""),
                prompt: prompt, multiSelect: false,
                choices: choices, correctIds: correctIds
              };
            });
          }
        });

        writeSets(newSets);
        alert("🎉 成功由 Excel 匯入題庫！");
      } catch(err){ alert("解析失敗，請確認檔案格式。"); }
    };
    reader.readAsArrayBuffer(file);
  };

    var templateData = [
      { "題型": "match", "題目名稱": "第一課生詞配對", "左欄生詞": "你好", "右欄拼音或意思": "nǐ hǎo", "題目說明": "", "選項(逗號分開)": "", "正確答案": "" },
      { "題型": "match", "題目名稱": "第一課生詞配對", "左欄生詞": "謝謝", "右欄拼音或意思": "xièxie", "題目說明": "", "選項(逗號分開)": "", "正確答案": "" },
      { "題型": "choice", "題目名稱": "第一課單選題", "左欄生詞": "", "右欄拼音或意思": "", "題目說明": "「謝謝」是什麼意思？", "選項(逗號分開)": "Hello, Thank you, Goodbye", "正確答案": "Thank you" }
    ];
    var ws = XLSX.utils.json_to_sheet(templateData);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "題庫範本");
    XLSX.writeFile(wb, "生詞練習台_完整題庫範本.xlsx");
  };

  document.getElementById("btn-export-excel").onclick = function(){
    var currentSets = getSets();
    var exportRows = [];
    Object.keys(currentSets).forEach(function(sid){
      var s = currentSets[sid];
      if(s.type === "match" && s.pairs){
        Object.keys(s.pairs).forEach(function(pid){
          exportRows.push({ "題型": "match", "題目名稱": s.title, "左欄生詞": s.pairs[pid].left, "右欄拼音或意思": s.pairs[pid].right, "題目說明": "", "選項(逗號分開)": "", "正確答案": "" });
        });
      } else if(s.type === "choice" && s.choices){
        var cTexts = Object.keys(s.choices).map(function(cid){ return s.choices[cid].text; }).join(", ");
        var ansText = s.choices[s.answerId] ? s.choices[s.answerId].text : "";
        exportRows.push({ "題型": "choice", "題目名稱": s.title, "左欄生詞": "", "右欄拼音或意思": "", "題目說明": s.prompt || "", "選項(逗號分開)": cTexts, "正確答案": ansText });
      }
    });
    if(exportRows.length === 0){ alert("目前沒有可匯出的題目。"); return; }
    var ws = XLSX.utils.json_to_sheet(exportRows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "題庫備份");
    XLSX.writeFile(wb, "生詞題庫備份_" + new Date().toISOString().slice(0,10) + ".xlsx");
  };

  /* 學生自填姓名引導 */
  function handleStudentJoin(){
    if(!isStudent || !urlRoom) return;
    if(urlName){
      myName = decodeURIComponent(urlName);
      attachPresence(urlRoom, myId, myName);
      startRoom(urlRoom, "student");
      return;
    }
    var nameDialog = document.getElementById("student-name-dialog");
    nameDialog.showModal();
    document.getElementById("btn-submit-student-name").onclick = function(){
      var entered = document.getElementById("input-student-name").value.trim();
      if(!entered) entered = "學生 " + Math.floor(10 + Math.random()*90);
      myName = entered;
      nameDialog.close();
      attachPresence(urlRoom, myId, myName);
      startRoom(urlRoom, "student");
    };
  }

  /* 初始化流程 */
  if(isStudent){
    window.addEventListener("firebase-bridge-ready", handleStudentJoin);
  } else if(urlRoom){
    window.addEventListener("firebase-bridge-ready", function(){
      attachPresence(urlRoom, "teacher", "老師");
      startRoom(urlRoom, "teacher");
    });
  } else {
    showLobby();
  }
})();
</script>
</body>
</html>
