<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生詞練習台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Public+Sans:wght@400;500;600;700&display=swap">
<!-- SheetJS: 支援 Excel 匯入與匯出 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F3F5EF;
    --surface:#FFFFFF;
    --surface-2:#EAEDE4;
    --ink:#2A333C;
    --ink-soft:#66717A;
    --grid-line:rgba(42,51,60,0.08);
    --seal:#B23B32;
    --seal-soft:#F5DFDB;
    --seal-ring:rgba(178,59,50,0.38);
    --bamboo:#4C7A5E;
    --bamboo-soft:#DEEBE3;
    --shadow: 0 1px 2px rgba(42,33,28,0.06), 0 6px 20px -8px rgba(42,33,28,0.18);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B211E; --surface:#232B27; --surface-2:#2A332E;
      --ink:#E8EBE4; --ink-soft:#9BA79E; --grid-line:rgba(232,235,228,0.08);
      --seal:#E2695C; --seal-soft:#3D2624; --seal-ring:rgba(226,105,92,0.42);
      --bamboo:#7BB294; --bamboo-soft:#223229;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 24px -8px rgba(0,0,0,0.5);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);}
  .app{
    background:var(--paper); color:var(--ink);
    font-family:"Public Sans","Noto Sans TC",-apple-system,sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
  }
  h1,h2,h3,.zh{ font-family:"LXGW WenKai TC","Noto Serif TC",serif; }
  button, input, textarea{font-family:inherit;}
  button:focus-visible{outline:2.5px solid var(--seal); outline-offset:2px;}

  /* topbar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;background:var(--surface);
    border-bottom:1px solid var(--grid-line); gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .stamp{
    width:34px;height:34px;flex:none; background:var(--seal);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:"LXGW WenKai TC",serif;font-size:18px;font-weight:700;
    border-radius:6px; transform:rotate(-6deg); box-shadow:var(--shadow);
  }
  .brand-text h1{margin:0;font-size:18px;font-weight:700;}
  .brand-text p{margin:1px 0 0;font-size:12px;color:var(--ink-soft);}
  .topbar-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--grid-line); background:var(--surface); color:var(--ink);
    padding:7px 13px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
    transition:all .12s ease;
  }
  .btn:hover{border-color:var(--ink-soft);}
  .btn-primary{background:var(--seal);border-color:var(--seal);color:#fff;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}

  .room-cluster{display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--grid-line);border-radius:10px;background:var(--paper);}
  .room-code{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;}
  .room-code b{color:var(--seal);}
  .presence-dot{width:9px;height:9px;border-radius:50%;background:var(--ink-soft);flex:none;}
  .presence-dot.online{background:var(--bamboo);}
  
  .toggle{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);cursor:pointer;user-select:none;}
  .toggle-track{width:34px;height:18px;border-radius:99px;background:var(--surface-2);border:1px solid var(--grid-line);position:relative;transition:background .15s ease;}
  .toggle-track::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s ease;}
  .toggle.on .toggle-track{background:var(--bamboo);border-color:var(--bamboo);}
  .toggle.on .toggle-track::after{transform:translateX(16px);}

  .layout{flex:1;display:grid;grid-template-columns:260px 1fr;min-height:0;}
  .app.student-mode .layout, .app.present .layout{grid-template-columns:1fr;}
  .app.student-mode .sidebar, .app.present .sidebar{display:none;}

  .sidebar{
    background:var(--surface); border-right:1px solid var(--grid-line); padding:16px;
    display:flex;flex-direction:column;gap:10px;overflow-y:auto;
  }
  .btn-new{width:100%;justify-content:center;padding:10px 14px;}
  .sidebar-excel-group{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
  
  .set-list{display:flex;flex-direction:column;gap:8px;}
  .set-card{
    text-align:left;border:1.5px solid var(--grid-line);background:var(--paper);
    border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;
  }
  .set-card:hover{border-color:var(--ink-soft);}
  .set-card.active{border-color:var(--seal);background:var(--seal-soft);}
  .set-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .set-card-title{font-size:14px;font-weight:600;}
  .badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-soft);}
  .set-card.active .badge{background:var(--seal);color:#fff;}
  .set-card-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:5px;align-self:flex-end;}
  .set-card-del:hover{color:var(--seal);}

  .stage-wrap{overflow-y:auto;padding:24px clamp(16px,4vw,40px);display:flex;justify-content:center;}
  .stage{
    width:100%;max-width:880px;background:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      var(--surface);
    background-size:28px 28px;border:1px solid var(--grid-line);border-radius:16px;
    padding:clamp(18px,3vw,32px); box-shadow:var(--shadow); min-height:450px; position:relative;
  }
  .app.student-mode .stage, .app.present .stage{max-width:1040px;}

  .stage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .stage-title{font-size:21px;font-weight:700;margin:0 0 4px;}
  .stage-sub{font-size:13px;color:var(--ink-soft);margin:0;}
  .stage-actions{display:flex;gap:8px;}

  /* 連連看：對錯回饋動畫 */
  .match-board{position:relative;}
  .match-cols{display:flex;justify-content:space-between;gap:clamp(20px,6vw,100px);position:relative;z-index:1;}
  .match-col{flex:1;display:flex;flex-direction:column;gap:12px;max-width:340px;}
  .match-col-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px;}
  .match-item{
    font-family:"LXGW WenKai TC",serif;font-size:18px;text-align:center;padding:12px 16px;
    border:2px solid var(--grid-line);background:var(--paper);color:var(--ink);border-radius:12px;cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .12s ease;
  }
  .match-item[data-side="right"]{font-family:"Public Sans",sans-serif;font-size:16px;}
  .match-item:hover:not(.matched):not(:disabled){border-color:var(--ink-soft);}
  .match-item.selected{border-color:var(--seal);box-shadow:0 0 0 3px var(--seal-ring) inset;}
  .match-item.matched{
    border-color:var(--bamboo);background:var(--bamboo-soft);color:var(--bamboo);
    font-weight:700;cursor:default;animation:popSuccess .3s ease;
  }
  .match-item.wrong{
    border-color:var(--seal) !important;background:var(--seal-soft) !important;
    animation:shakeWrong .45s ease;
  }
  @keyframes shakeWrong{
    10%, 90% { transform: translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate3d(4px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
    40%, 60% { transform: translate3d(6px, 0, 0); }
  }
  @keyframes popSuccess{
    0%{ transform:scale(0.96); }
    50%{ transform:scale(1.04); }
    100%{ transform:scale(1); }
  }
  .match-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}

  /* 圈選題：對錯回饋 */
  .circle-prompt{font-family:"LXGW WenKai TC",serif;font-size:19px;margin:0 0 18px;line-height:1.6;}
  .circle-choices{display:flex;flex-wrap:wrap;gap:14px;position:relative;}
  .circle-chip{
    font-family:"Public Sans","Noto Sans TC",sans-serif;font-size:16px;font-weight:500;padding:12px 22px;
    border-radius:48% 52% 51% 49% / 53% 47% 53% 47%;border:2.5px solid var(--grid-line);
    background:var(--paper);color:var(--ink);cursor:pointer;min-width:88px;text-align:center;transition:all .15s ease;
  }
  .circle-chip.selected{border-color:var(--seal);background:var(--seal-soft);color:var(--seal);font-weight:700;}
  .circle-chip.correct{border-color:var(--bamboo);background:var(--bamboo-soft);color:var(--bamboo);font-weight:700;animation:popSuccess .3s ease;}
  .circle-chip.missed{border-color:var(--bamboo);border-style:dashed;color:var(--bamboo);}
  .circle-chip.selected-wrong{border-color:var(--ink-soft);background:var(--surface-2);color:var(--ink-soft);text-decoration:line-through;}

  /* 寫字畫布白板 */
  .draw-board-container{display:flex;flex-direction:column;gap:12px;position:relative;}
  .draw-toolbar{
    display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;
    background:var(--surface-2);border:1px solid var(--grid-line);flex-wrap:wrap;
  }
  .tool-btn{
    padding:6px 10px;border-radius:7px;border:1.5px solid transparent;background:var(--surface);
    font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;
  }
  .tool-btn.active{border-color:var(--seal);background:var(--seal-soft);color:var(--seal);}
  .tool-sep{width:1px;height:20px;background:var(--grid-line);margin:0 2px;}

  .grid-toggle-btn{
    padding:5px 8px;font-size:11.5px;font-weight:600;border-radius:6px;
    border:1px solid var(--grid-line);background:var(--surface);cursor:pointer;
  }
  .grid-toggle-btn.active{background:var(--seal);color:#fff;border-color:var(--seal);}

  .tone-group{display:inline-flex;align-items:center;gap:3px;background:var(--surface);padding:3px 6px;border-radius:8px;border:1px solid var(--grid-line);}
  .tone-btn{
    width:24px;height:24px;padding:0;border:1px solid transparent;border-radius:5px;
    background:transparent;font-size:15px;font-weight:700;line-height:1;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;color:var(--ink);
  }
  .tone-btn:hover{background:var(--seal-soft);color:var(--seal);}

  .color-dot{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .color-dot.active{border-color:var(--ink);transform:scale(1.15);}
  .size-btn{padding:4px 8px;font-size:11px;border-radius:5px;border:1px solid var(--grid-line);background:var(--surface);cursor:pointer;}
  .size-btn.active{background:var(--ink);color:var(--paper);}

  .canvas-stage-wrap{
    position:relative;width:100%;height:520px;background:#FFFDF8;
    border:2px solid var(--grid-line);border-radius:12px;overflow:hidden;
  }
  .canvas-stage-wrap.grid-tian{
    background-image:
      linear-gradient(to right, rgba(178,59,50,0.18) 1.5px, transparent 1.5px),
      linear-gradient(to bottom, rgba(178,59,50,0.18) 1.5px, transparent 1.5px);
    background-size:50% 50%;
  }
  .canvas-stage-wrap.grid-jiu{
    background-image:
      linear-gradient(to right, rgba(178,59,50,0.18) 1.5px, transparent 1.5px),
      linear-gradient(to bottom, rgba(178,59,50,0.18) 1.5px, transparent 1.5px);
    background-size:33.333% 33.333%;
  }

  .bg-img-layer{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:1;
  }
  canvas#paint-canvas{
    position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;cursor:crosshair;
  }
  .text-layer{position:absolute;inset:0;z-index:3;pointer-events:none;}
  .movable-text{
    position:absolute;pointer-events:auto;cursor:move;font-family:"LXGW WenKai TC",serif;
    font-weight:700;line-height:1.2;color:var(--ink);user-select:none;
    padding:3px 6px;border:1.5px dashed transparent;border-radius:6px;white-space:pre;
  }
  .movable-text:hover, .movable-text.active{border-color:var(--seal);background:rgba(255,255,255,0.88);}

  .peer-cursor{
    position:absolute;left:0;top:0;pointer-events:none;z-index:99999;
    display:none;align-items:center;gap:5px;transform:translate(-50%,-50%);
    transition:left .06s linear, top .06s linear;
  }
  .peer-cursor.show{display:flex;}
  .peer-cursor-dot{width:14px;height:14px;border-radius:50%;background:var(--seal);border:2px solid var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.35);}
  .peer-cursor-label{background:var(--seal);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;}

  .editor-dialog{border:none;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(580px,92vw);max-height:86vh;}
  .editor-dialog::backdrop{background:rgba(20,20,18,0.45);}
  .editor-head{padding:20px 24px 4px;}
  .editor-head h2{margin:0 0 2px;font-size:19px;}
  .editor-body{padding:16px 24px;overflow-y:auto;max-height:56vh;}
  .editor-foot{padding:14px 24px 22px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--grid-line);margin-top:8px;}
  .type-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .type-toggle button{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--grid-line);background:var(--paper);color:var(--ink-soft);font-weight:600;font-size:13px;cursor:pointer;}
  .type-toggle button.active{border-color:var(--seal);color:var(--seal);background:var(--seal-soft);}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:14px 0 5px;}
  input[type="text"], textarea{width:100%;border:1.5px solid var(--grid-line);background:var(--paper);color:var(--ink);border-radius:8px;padding:9px 11px;font-size:14px;}
  .row-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pair-row, .choice-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .pair-row input, .choice-row input[type="text"]{flex:1;}
  .row-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;padding:4px 7px;}
  .add-row-btn{font-size:12.5px;color:var(--seal);background:none;border:none;cursor:pointer;font-weight:600;padding:4px 0;}

  .upload-box{border:2px dashed var(--grid-line);padding:14px;border-radius:10px;text-align:center;cursor:pointer;background:var(--paper);}
  .upload-box:hover{border-color:var(--seal);}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="stamp">好</div>
      <div class="brand-text">
        <h1 id="brand-title">生詞練習台</h1>
        <p id="brand-sub">連連看・圈選・生字書寫板</p>
      </div>
    </div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <button class="btn btn-primary btn-new" id="btn-new" type="button">＋ 新增題目</button>

      <div class="sidebar-excel-group">
        <button type="button" class="btn btn-sm" id="btn-import-excel" style="width:100%; justify-content:center;">📊 匯入 Excel 題庫</button>
        <div style="display:flex; gap:6px;">
          <button type="button" class="btn btn-sm btn-ghost" id="btn-dl-template" style="flex:1; justify-content:center; border:1px solid var(--grid-line);" title="下載填題格式檔">📥 空白範本</button>
          <button type="button" class="btn btn-sm btn-ghost" id="btn-export-excel" style="flex:1; justify-content:center; border:1px solid var(--grid-line);" title="匯出目前題庫成Excel">📤 匯出題目</button>
        </div>
        <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" style="display:none;">
      </div>

      <div class="set-list" id="set-list"></div>
    </aside>
    <main class="stage-wrap">
      <div class="stage" id="stage"></div>
    </main>
  </div>
</div>

<dialog class="editor-dialog" id="editor-dialog">
  <form id="editor-form">
    <div class="editor-head">
      <h2>新增題目／畫板</h2>
    </div>
    <div class="editor-body">
      <div class="type-toggle" id="type-toggle">
        <button type="button" data-type="match" class="active">連連看</button>
        <button type="button" data-type="circle">圈出來</button>
        <button type="button" data-type="board">✍️ 寫字／圖片板</button>
      </div>

      <label for="f-title">題目名稱</label>
      <input type="text" id="f-title" placeholder="例如：第四課生字書寫" required>

      <div id="match-fields">
        <div class="row-two">
          <div><label>左欄標籤</label><input type="text" id="f-left-label" value="生詞"></div>
          <div><label>右欄標籤</label><input type="text" id="f-right-label" value="拼音／意思"></div>
        </div>
        <label>配對內容</label>
        <div id="pair-rows"></div>
        <button type="button" class="add-row-btn" id="add-pair">＋ 新增一組</button>
      </div>

      <div id="circle-fields" style="display:none;">
        <label>題目／提示文字</label>
        <textarea id="f-prompt" rows="2" placeholder="例如：「謝謝」是什麼意思？"></textarea>
        <label>選項（勾選代表正確答案）</label>
        <div id="choice-rows"></div>
        <button type="button" class="add-row-btn" id="add-choice">＋ 新增選項</button>
      </div>

      <div id="board-fields" style="display:none;">
        <label>底圖設定（選填，可用於課本頁面或背景圖）</label>
        <div class="upload-box" id="upload-box">
          <span id="upload-tip">📷 點擊上傳背景圖片（JPG/PNG）</span>
          <input type="file" id="f-board-img" accept="image/*" style="display:none;">
        </div>
        <label>教學指引</label>
        <input type="text" id="f-board-desc" placeholder="例如：請在格線中寫出『好』">
      </div>
    </div>
    <div class="editor-foot">
      <button type="button" class="btn btn-ghost" id="btn-cancel">取消</button>
      <button type="submit" class="btn btn-primary">儲存題目</button>
    </div>
  </form>
</dialog>

<script type="module">
(async function(){
  try{
    var appMod = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js");
    var dbMod = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js");
    var authMod = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js");
    var fbApp = appMod.initializeApp(window.FIREBASE_CONFIG);
    window.db = dbMod.getDatabase(fbApp);
    window.ref = dbMod.ref; window.onValue = dbMod.onValue; window.set = dbMod.set;
    window.update = dbMod.update; window.get = dbMod.get; window.onDisconnect = dbMod.onDisconnect;
    window.serverTimestamp = dbMod.serverTimestamp;
    window.auth = authMod.getAuth(fbApp);
    await new Promise(function(resolve, reject){
      authMod.onAuthStateChanged(window.auth, function(user){ if(user) resolve(user); });
      authMod.signInAnonymously(window.auth).catch(reject);
    });
    window.__firebaseReady = true;
    window.dispatchEvent(new Event("firebase-bridge-ready"));
  }catch(e){
    console.error("Firebase 連線初始化失敗：", e);
  }
})();
</script>

<script>
(function(){
  "use strict";

  /* ================== WEB AUDIO API 專業對錯音效生成器 (免外部音檔) ================== */
  var audioCtx = null;
  function getAudioContext(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
    return audioCtx;
  }

  // 1. 答對音效 (清脆明亮的 Ding-Dong 雙音和弦)
  function playCorrectSound(){
    try{
      var ctx = getAudioContext();
      var now = ctx.currentTime;
      // 第一聲 E6 (1318Hz)
      var osc1 = ctx.createOscillator();
      var gain1 = ctx.createGain();
      osc1.type = "sine";
      osc1.frequency.setValueAtTime(1318.5, now);
      gain1.gain.setValueAtTime(0.18, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc1.connect(gain1); gain1.connect(ctx.destination);
      osc1.start(now); osc1.stop(now + 0.35);

      // 第二聲 G6 (1567Hz)
      var osc2 = ctx.createOscillator();
      var gain2 = ctx.createGain();
      osc2.type = "sine";
      osc2.frequency.setValueAtTime(1567.9, now + 0.1);
      gain2.gain.setValueAtTime(0.22, now + 0.1);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
      osc2.connect(gain2); gain2.connect(ctx.destination);
      osc2.start(now + 0.1); osc2.stop(now + 0.55);
    }catch(e){}
  }

  // 2. 答錯音效 (輕柔短促的 Buzz 低音提示)
  function playWrongSound(){
    try{
      var ctx = getAudioContext();
      var now = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(220, now); // A3
      osc.frequency.setValueAtTime(185, now + 0.1); // F#3 下降音
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.32);
    }catch(e){}
  }

  // 3. 全對勝利號角
  function playVictorySound(){
    try{
      var ctx = getAudioContext();
      var now = ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach(function(freq, idx){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
        gain.gain.setValueAtTime(0.2, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now + idx * 0.12); osc.stop(now + idx * 0.12 + 0.4);
      });
    }catch(e){}
  }

  /* 寫字板功能 */
  function renderDrawBoard(s){
    var progress = getProgress(s.id);

    var texts = progress.texts || [];
    var currentGrid = progress.gridType || s.gridType || "jiu";

    toolbar.innerHTML = `
      <button type="button" class="tool-btn active" data-tool="pen">✏️ 畫筆</button>
      <button type="button" class="tool-btn" data-tool="text">🔤 打字</button>
      <button type="button" class="tool-btn" data-tool="select">✋ 移動</button>
      <button type="button" class="tool-btn" data-tool="stroke-eraser" title="點選整條筆畫刪除（持續有效）">🪄 筆畫擦</button>

      <button type="button" class="grid-toggle-btn ${currentGrid==='tian'?'active':''}" data-grid="tian">田字格</button>
      <button type="button" class="grid-toggle-btn ${currentGrid==='jiu'?'active':''}" data-grid="jiu">九宮格</button>

      <div class="tone-group">

        <button type="button" class="tone-btn" data-tone="ˊ" title="二聲">ˊ</button>
        <button type="button" class="tone-btn" data-tone="ˇ" title="三聲">ˇ</button>
        <button type="button" class="tone-btn" data-tone="ˋ" title="四聲">ˋ</button>
        <button type="button" class="tone-btn" data-tone="˙" title="輕聲">˙</button>
      </div>
      <div class="tool-sep"></div>

      <span style="font-size:12px;color:var(--ink-soft);">顏色:</span>
      <div class="color-dot active" data-color="#B23B32" style="background:#B23B32;"></div>
      <div class="color-dot" data-color="#2A333C" style="background:#2A333C;"></div>
      <div class="color-dot" data-color="#1E88E5" style="background:#1E88E5;"></div>
      <div class="color-dot" data-color="#4C7A5E" style="background:#4C7A5E;"></div>
      <div class="color-dot" data-color="#FB8C00" style="background:#FB8C00;"></div>
      <div class="tool-sep"></div>
      
      <span style="font-size:12px;color:var(--ink-soft);">粗細:</span>

      <button type="button" class="size-btn" data-size="12">粗</button>

      <button type="button" class="btn btn-sm" id="btn-clear-draw" style="color:var(--seal);">🗑️ 清空</button>
    `;
    wrap.appendChild(toolbar);

    var cWrap = document.createElement("div"); 
    cWrap.className = "canvas-stage-wrap " + (currentGrid === 'tian' ? 'grid-tian' : (currentGrid === 'jiu' ? 'grid-jiu' : ''));
    if(s.bgImage){
      var img = document.createElement("img"); img.className = "bg-img-layer"; img.src = s.bgImage;
      cWrap.appendChild(img);
    }
    var canvas = document.createElement("canvas"); canvas.id = "paint-canvas";
    var textLayer = document.createElement("div"); textLayer.className = "text-layer";
    cWrap.appendChild(canvas);
    cWrap.appendChild(textLayer);
    wrap.appendChild(cWrap);
    stageEl.appendChild(wrap);

    var ctx = canvas.getContext("2d");
    var activeTool = "pen";
    var activeColor = "#B23B32";
    var activeSize = 3;
    var isDrawing = false;
    var currentPath = [];
    var activeSelectedTextId = null;

    function resizeCanvas(){
      var r = cWrap.getBoundingClientRect();
      if(r.width > 0 && r.height > 0){
        canvas.width = r.width; canvas.height = r.height;
        redrawStrokes();
      }
    }
    requestAnimationFrame(resizeCanvas);

    function redrawStrokes(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      strokes.forEach(function(st){
        if(!st.points || st.points.length < 2) return;
        ctx.save();
        if(st.isEraser){
          ctx.globalCompositeOperation = "destination-out";
          ctx.lineWidth = st.size * 2.5;
        } else {
          ctx.globalCompositeOperation = "source-over";
          ctx.strokeStyle = st.color;
          ctx.lineWidth = st.size;
        }
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(st.points[0].x * canvas.width / 100, st.points[0].y * canvas.height / 100);
        for(var i=1; i<st.points.length; i++){
          ctx.lineTo(st.points[i].x * canvas.width / 100, st.points[i].y * canvas.height / 100);
        }
        ctx.stroke();
        ctx.restore();
      });
      renderTexts();
    }

    function renderTexts(){
      textLayer.innerHTML = "";
      texts.forEach(function(t, idx){
        var div = document.createElement("div");
        div.className = "movable-text" + (t.id === activeSelectedTextId ? " active" : "");
        div.textContent = t.text;
        div.style.left = t.x + "%";
        div.style.top = t.y + "%";
        div.style.color = t.color || "#2A333C";
        div.style.fontSize = (t.fontSize || 28) + "px";

        div.onmousedown = function(e){
          if(activeTool === "stroke-eraser"){
            texts.splice(idx, 1);
            writeProgress(s.id, { texts: texts });
            return;
          }
          activeSelectedTextId = t.id;
          renderTexts();

          if(activeTool !== "select") return;
          e.stopPropagation();
          var startX = e.clientX, startY = e.clientY;
          var origX = t.x, origY = t.y;
          var rect = cWrap.getBoundingClientRect();

          function onMove(ev){
            var dx = (ev.clientX - startX) / rect.width * 100;
            var dy = (ev.clientY - startY) / rect.height * 100;
            t.x = Math.max(0, Math.min(95, origX + dx));
            t.y = Math.max(0, Math.min(95, origY + dy));
            div.style.left = t.x + "%";
            div.style.top = t.y + "%";
          }
          function onUp(){
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            writeProgress(s.id, { texts: texts });
          }
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        };
        textLayer.appendChild(div);
      });
    }

    function getPos(e){
      var r = cWrap.getBoundingClientRect();
      var cx = e.touches ? e.touches[0].clientX : e.clientX;
      var cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - r.left) / r.width * 100,
        y: (cy - r.top) / r.height * 100
      };
    }

    function checkStrokeHit(p){
      for(var i = strokes.length - 1; i >= 0; i--){
        var pts = strokes[i].points;
        for(var j=0; j<pts.length; j++){
          var dist = Math.hypot(pts[j].x - p.x, pts[j].y - p.y);
          if(dist < 3.5){
            strokes.splice(i, 1);
            writeProgress(s.id, { strokes: strokes });
            return true;
          }
        }
      }
      return false;
    }

    canvas.onmousedown = function(e){
      if(!canInteract()) return;
      var p = getPos(e);
      activeSelectedTextId = null;

      if(activeTool === "stroke-eraser"){
        checkStrokeHit(p);
        return;
      }
      if(activeTool === "text"){
        var txt = prompt("請輸入文字內容（漢字或拼音）：");
        if(txt && txt.trim()){
          var sizeChoice = prompt("請輸入字體大小 (例如 24, 36, 48, 64)：", "32");
          var fSize = parseInt(sizeChoice, 10);
          if(isNaN(fSize) || fSize < 12) fSize = 32;

          texts.push({ 
            id: uid("t"), 
            text: txt.trim(), 
            x: p.x, 
            y: p.y, 
            color: activeColor, 
            fontSize: fSize 
          });
          writeProgress(s.id, { texts: texts });
        }
        return;
      }
      if(activeTool === "select") return;

      isDrawing = true;
      currentPath = [p];
    };

    window.onmousemove = function(e){
      if(!isDrawing) return;
      var p = getPos(e);
      currentPath.push(p);

      ctx.save();
      if(activeTool === "pixel-eraser"){
        ctx.globalCompositeOperation = "destination-out";
        ctx.lineWidth = activeSize * 2.5;
      } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = activeColor;
        ctx.lineWidth = activeSize;
      }
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath();
      var pts = currentPath;
      if(pts.length >= 2){
        ctx.moveTo(pts[pts.length-2].x * canvas.width / 100, pts[pts.length-2].y * canvas.height / 100);
        ctx.lineTo(p.x * canvas.width / 100, p.y * canvas.height / 100);
        ctx.stroke();
      }
      ctx.restore();
    };

    window.onmouseup = function(){
      if(!isDrawing) return;
      isDrawing = false;
      if(currentPath.length >= 2){
        strokes.push({
          id: uid("st"),
          points: currentPath,
          color: activeColor,
          size: activeSize,
          isEraser: activeTool === "pixel-eraser"
        });
        writeProgress(s.id, { strokes: strokes });
      }
      currentPath = [];
    };

    toolbar.querySelectorAll(".tool-btn").forEach(function(b){
      b.onclick = function(){
        toolbar.querySelectorAll(".tool-btn").forEach(function(x){ x.classList.remove("active"); });
        b.classList.add("active");
        activeTool = b.dataset.tool;
        canvas.style.cursor = (activeTool === "select" ? "default" : (activeTool === "text" ? "text" : "crosshair"));
      };
    });

    toolbar.querySelectorAll(".grid-toggle-btn").forEach(function(gb){
      gb.onclick = function(){
        toolbar.querySelectorAll(".grid-toggle-btn").forEach(function(x){ x.classList.remove("active"); });
        gb.classList.add("active");
        var gType = gb.dataset.grid;
        cWrap.className = "canvas-stage-wrap " + (gType === 'tian' ? 'grid-tian' : (gType === 'jiu' ? 'grid-jiu' : ''));
        writeProgress(s.id, { gridType: gType });
      };
    });

    toolbar.querySelectorAll(".tone-btn").forEach(function(tb){
      tb.onclick = function(e){
        e.stopPropagation();
        var tone = tb.dataset.tone;
        if(activeSelectedTextId){
          var selObj = texts.find(function(item){ return item.id === activeSelectedTextId; });
          if(selObj){
            selObj.text += tone;
            writeProgress(s.id, { texts: texts });
            return;
          }
        }
        texts.push({
          id: uid("t"),
          text: tone,
          x: 48,
          y: 45,
          color: activeColor,
          fontSize: 36
        });
        writeProgress(s.id, { texts: texts });
      };
    });

    toolbar.querySelectorAll(".color-dot").forEach(function(d){
      d.onclick = function(){
        toolbar.querySelectorAll(".color-dot").forEach(function(x){ x.classList.remove("active"); });
        d.classList.add("active");
        activeColor = d.dataset.color;
      };
    });

    toolbar.querySelectorAll(".size-btn").forEach(function(sBtn){
      sBtn.onclick = function(){
        toolbar.querySelectorAll(".size-btn").forEach(function(x){ x.classList.remove("active"); });
        sBtn.classList.add("active");
        activeSize = Number(sBtn.dataset.size);
      };
    });

    document.getElementById("btn-clear-draw").onclick = function(){
      if(confirm("確定要清空畫布上的所有內容嗎？")){
        strokes = []; texts = [];
        writeProgress(s.id, { strokes: strokes, texts: texts });
      }
    };
  }

  /* 連連看：完美音效與對錯動畫 */
  function renderMatchBoard(s){
    var progress = getProgress(s.id);
    var matched = progress.matched || {};
    var interactive = canInteract();

    var wrap = document.createElement("div"); wrap.className = "match-board";
    var svg = document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.setAttribute("class","match-svg");
    wrap.appendChild(svg);
    var cols = document.createElement("div"); cols.className = "match-cols";
    var lCol = document.createElement("div"); lCol.className = "match-col";
    var rCol = document.createElement("div"); rCol.className = "match-col";
    lCol.innerHTML = '<div class="match-col-label">' + (s.leftLabel || "項目一") + '</div>';
    rCol.innerHTML = '<div class="match-col-label">' + (s.rightLabel || "項目二") + '</div>';

    var pIds = Object.keys(s.pairs).sort();
    var rOrder = pIds.slice().sort(function(a, b){
      var strA = s.pairs[a].right.toLowerCase();
      var strB = s.pairs[b].right.toLowerCase();
      return strA.localeCompare(strB);
    });

    var selL = null, selR = null;

    pIds.forEach(function(pid){
      var p = s.pairs[pid];
      var btn = document.createElement("button"); btn.type="button"; 
      btn.className = "match-item zh" + (matched[pid] ? " matched" : "");
      btn.textContent = p.left; 
      btn.dataset.id = pid; btn.dataset.side = "left";
      if(matched[pid] || !interactive) btn.disabled = true;
      btn.onclick = function(){
        if(matched[pid] || !interactive) return;
        lCol.querySelectorAll(".match-item").forEach(function(el){ el.classList.remove("selected"); });
        btn.classList.add("selected");
        selL = pid; checkMatch();
      };
      lCol.appendChild(btn);
    });

    rOrder.forEach(function(pid){
      var p = s.pairs[pid];
      var btn = document.createElement("button"); btn.type="button"; 
      btn.className = "match-item" + (matched[pid] ? " matched" : "");
      btn.textContent = p.right; 
      btn.dataset.id = pid; btn.dataset.side = "right";
      if(matched[pid] || !interactive) btn.disabled = true;
      btn.onclick = function(){
        if(matched[pid] || !interactive) return;
        rCol.querySelectorAll(".match-item").forEach(function(el){ el.classList.remove("selected"); });
        btn.classList.add("selected");
        selR = pid; checkMatch();
      };
      rCol.appendChild(btn);
    });

    function checkMatch(){
      if(selL && selR){
        var leftBtn = lCol.querySelector(`.match-item[data-id="${selL}"]`);
        var rightBtn = rCol.querySelector(`.match-item[data-id="${selR}"]`);

        if(selL === selR){
          // ✅ 答對：播放叮咚音效，按鈕變綠並同步
          playCorrectSound();
          matched[selL] = true;
          writeProgress(s.id, { matched: matched });

          // 若全對則播放勝利慶祝音樂
          if(Object.keys(matched).length === pIds.length){
            setTimeout(playVictorySound, 400);
          }
        } else {
          // ❌ 答錯：播放提示低音，雙按鈕發紅劇烈晃動
          playWrongSound();
          if(leftBtn) leftBtn.classList.add("wrong");
          if(rightBtn) rightBtn.classList.add("wrong");
          setTimeout(function(){
            if(leftBtn){ leftBtn.classList.remove("wrong", "selected"); }
            if(rightBtn){ rightBtn.classList.remove("wrong", "selected"); }
          }, 450);
        }
        selL = null; selR = null;
      }
    }

    cols.appendChild(lCol); cols.appendChild(rCol);
    wrap.appendChild(cols);
    stageEl.appendChild(wrap);

    // 繪製連線
    function drawLines(){
      var rect = wrap.getBoundingClientRect();
      svg.setAttribute("viewBox","0 0 "+rect.width+" "+rect.height);
      svg.innerHTML = "";
      Object.keys(matched).forEach(function(pid){
        var l = lCol.querySelector(`.match-item[data-id="${pid}"]`);
        var r = rCol.querySelector(`.match-item[data-id="${pid}"]`);
        if(!l || !r) return;
        var lr = l.getBoundingClientRect(), rr = r.getBoundingClientRect();
        var x1 = lr.right - rect.left, y1 = lr.top + lr.height/2 - rect.top;
        var x2 = rr.left - rect.left, y2 = rr.top + rr.height/2 - rect.top;
        var mx = (x1+x2)/2;
        var path = document.createElementNS("http://www.w3.org/2000/svg","path");
        path.setAttribute("d", "M"+x1+","+y1+" C "+mx+","+y1+" "+mx+","+y2+" "+x2+","+y2);
        path.setAttribute("stroke", "#4C7A5E"); path.setAttribute("stroke-width","3");
        path.setAttribute("fill","none"); path.setAttribute("stroke-linecap","round");
        svg.appendChild(path);
      });
    }
    requestAnimationFrame(drawLines);
    window.addEventListener("resize", drawLines);
  }

  /* 圈選題：音效與公佈答案 */
  function renderCircleBoard(s){
    var progress = getProgress(s.id);
    var selected = progress.selected || {};
    var interactive = canInteract();
    var correctIds = s.correctIds || [];

    var wrap = document.createElement("div");
    wrap.innerHTML = '<p class="circle-prompt zh">' + s.prompt + '</p>';
    var cBox = document.createElement("div"); cBox.className = "circle-choices";

    Object.keys(s.choices).forEach(function(cid){
      var c = s.choices[cid];
      var btn = document.createElement("button"); 
      var isSel = !!selected[cid];
      var isCorrect = correctIds.indexOf(cid) !== -1;

      btn.className = "circle-chip";
      btn.textContent = c.text;

      if(progress.revealed){
        if(isCorrect && isSel) btn.classList.add("correct");
        else if(isCorrect && !isSel) btn.classList.add("missed");
        else if(!isCorrect && isSel) btn.classList.add("selected-wrong");
        btn.disabled = true;
      } else {
        if(isSel) btn.classList.add("selected");
        if(!interactive) btn.disabled = true;
      }

      btn.onclick = function(){
        if(!interactive || progress.revealed) return;
        selected[cid] = !selected[cid];
        
        // 點選音效反饋
        if(selected[cid]){
          if(isCorrect) playCorrectSound();
          else playWrongSound();
        }
        writeProgress(s.id, { selected: selected });
      };
      cBox.appendChild(btn);
    });
    wrap.appendChild(cBox);

    if(progress.revealed){
      var note = document.createElement("p");
      note.style.fontSize = "13px"; note.style.color = "var(--ink-soft)"; note.style.marginTop = "14px";
      note.textContent = "綠色實線＝答對；綠色虛線＝漏選答案；劃線＝選錯。";
      wrap.appendChild(note);
    }

    stageEl.appendChild(wrap);
  }

  /* 遠端游標常駐監聽 */
  function ensurePeerCursorEl(){
    var el = document.getElementById("peer-cursor");
    if(!el){
      el = document.createElement("div"); el.id = "peer-cursor"; el.className = "peer-cursor";
      el.innerHTML = '<span class="peer-cursor-dot"></span><span class="peer-cursor-label">' + (roomRole==="teacher"?"學生":"老師") + '</span>';
      stageEl.appendChild(el);
    }
    return el;
  }
  function renderPeerCursor(c){
    var el = ensurePeerCursorEl();
    if(!c || c.x == null || !cursorOn){ el.classList.remove("show"); return; }
    el.style.left = c.x + "%"; el.style.top = c.y + "%";
    el.classList.add("show");
  }

  var lastM = 0;
  window.addEventListener("mousemove", function(e){
    if(!inRoom() || !cursorOn) return;
    var now = Date.now();
    if(now - lastM < 45) return;
    lastM = now;
    var r = stageEl.getBoundingClientRect();
    if(r.width === 0 || r.height === 0) return;
    var x = Math.max(0, Math.min(100, ((e.clientX - r.left) / r.width) * 100));
    var y = Math.max(0, Math.min(100, ((e.clientY - r.top) / r.height) * 100));
    update(ref(db, "roomCursors/" + activeRoomId + "/" + roomRole), { x: x, y: y });
  });

  /* 題目手動編輯彈窗 */
  var dialog = document.getElementById("editor-dialog");
  var typeToggle = document.getElementById("type-toggle");
  var matchFields = document.getElementById("match-fields");
  var circleFields = document.getElementById("circle-fields");
  var boardFields = document.getElementById("board-fields");
  var currentType = "match";
  var uploadedBase64 = "";

  typeToggle.querySelectorAll("button").forEach(function(b){
    b.onclick = function(){
      typeToggle.querySelectorAll("button").forEach(function(x){ x.classList.remove("active"); });
      b.classList.add("active");
      currentType = b.dataset.type;
      matchFields.style.display = currentType === "match" ? "" : "none";
      circleFields.style.display = currentType === "circle" ? "" : "none";
      boardFields.style.display = currentType === "board" ? "" : "none";
    };
  });

  var fileInput = document.getElementById("f-board-img");
  document.getElementById("upload-box").onclick = function(){ fileInput.click(); };
  fileInput.onchange = function(e){
    var f = e.target.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      var img = new Image();
      img.onload = function(){
        var c = document.createElement("canvas");
        var scale = Math.min(1, 900 / img.width);
        c.width = img.width * scale; c.height = img.height * scale;
        var cx = c.getContext("2d");
        cx.drawImage(img, 0, 0, c.width, c.height);
        uploadedBase64 = c.toDataURL("image/jpeg", 0.7);
        document.getElementById("upload-tip").textContent = "✅ 已上傳圖片：" + f.name;
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(f);
  };

  document.getElementById("btn-new").onclick = function(){
    uploadedBase64 = "";
    document.getElementById("upload-tip").textContent = "📷 點擊上傳背景圖片（JPG/PNG）";
    dialog.showModal();
  };
  document.getElementById("btn-cancel").onclick = function(){ dialog.close(); };

  document.getElementById("editor-form").onsubmit = function(e){
    e.preventDefault();
    var title = document.getElementById("f-title").value.trim();
    if(!title) return;

    var newSet;
    if(currentType === "board"){
      newSet = {
        id: uid("set"), type: "board", title: title,
        desc: document.getElementById("f-board-desc").value.trim(),
        bgImage: uploadedBase64,
        gridType: "jiu"
      };
    } else if(currentType === "match"){
      newSet = {
        id: uid("set"), type: "match", title: title,
        pairs: { p1:{id:"p1", left:"生詞1", right:"拼音1"}, p2:{id:"p2", left:"生詞2", right:"拼音2"} }
      };
    } else {
      newSet = {
        id: uid("set"), type: "circle", title: title, prompt: "題目內容",
        choices: { c1:{id:"c1", text:"選項A"}, c2:{id:"c2", text:"選項B"} }, correctIds:["c1"]
      };
    }
    var sets = Object.assign({}, getSets());
    sets[newSet.id] = newSet;
    writeSets(sets, newSet.id);
    dialog.close();
  };

  /* ================== EXCEL 批次操作 ================== */
  var excelInput = document.getElementById("excel-file-input");
  document.getElementById("btn-import-excel").onclick = function(){ excelInput.click(); };

  excelInput.onchange = function(e){
    var file = e.target.files[0];
    if(!file) return;

    var reader = new FileReader();
    reader.onload = function(evt){
      try {
        var data = new Uint8Array(evt.target.result);
        var wb = XLSX.read(data, { type: 'array' });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws);

        if(!rows || rows.length === 0){
          alert("Excel 檔案內沒有資料！");
          return;
        }

        var newSets = Object.assign({}, getSets());
        var grouped = {};

        rows.forEach(function(row){
          var title = row["題目名稱"] || row["Title"] || "未命名題目";
          var type = (row["題型"] || row["Type"] || "match").toLowerCase();
          if(!grouped[title]){
            grouped[title] = { title: title, type: type, items: [], desc: row["說明"] || row["Desc"] || "" };
          }
          grouped[title].items.push(row);
        });

        Object.keys(grouped).forEach(function(tKey){
          var g = grouped[tKey];
          var newId = uid("set");

          if(g.type === "match"){
            var pairs = {};
            g.items.forEach(function(it, idx){
              var pid = "p" + (idx + 1);
              var l = it["左欄生詞"] || it["Left"] || "";
              var r = it["右欄拼音或意思"] || it["Right"] || "";
              if(l && r) pairs[pid] = { id: pid, left: String(l), right: String(r) };
            });
            newSets[newId] = {
              id: newId, type: "match", title: g.title,
              leftLabel: "生詞", rightLabel: "拼音／意思",
              pairs: pairs
            };
          } else if(g.type === "circle"){
            g.items.forEach(function(it, idx){
              var subId = uid("set");
              var prompt = it["題目說明"] || it["Prompt"] || g.title;
              var rawChoices = String(it["選項(逗號分開)"] || it["Choices"] || "").split(/[,，、]/);
              var answer = String(it["正確答案"] || it["Answer"] || "").trim();
              var choices = {};
              var correctIds = [];

              rawChoices.forEach(function(cText, cIdx){
                var cid = "c" + (cIdx + 1);
                var trimTxt = cText.trim();
                if(trimTxt){
                  choices[cid] = { id: cid, text: trimTxt };
                  if(trimTxt === answer) correctIds.push(cid);
                }
              });

              newSets[subId] = {
                id: subId, type: "circle",
                title: g.title + (g.items.length > 1 ? " (" + (idx+1) + ")" : ""),
                prompt: prompt, multiSelect: false,
                choices: choices, correctIds: correctIds
              };
            });
          }
        });

        writeSets(newSets);
        alert("🎉 成功由 Excel 匯入 " + Object.keys(grouped).length + " 組題庫！");
      } catch(err){
        alert("解析失敗，請確認檔案格式是否相符。");
      }
    };
    reader.readAsArrayBuffer(file);
  };

  document.getElementById("btn-dl-template").onclick = function(){
    var templateData = [
      { "題型": "match", "題目名稱": "第一課生詞配對範例", "左欄生詞": "你好", "右欄拼音或意思": "nǐ hǎo", "題目說明": "", "選項(逗號分開)": "", "正確答案": "" },
      { "題型": "match", "題目名稱": "第一課生詞配對範例", "左欄生詞": "謝謝", "右欄拼音或意思": "xièxie", "題目說明": "", "選項(逗號分開)": "", "正確答案": "" },
      { "題型": "circle", "題目名稱": "語意測驗範例", "左欄生詞": "", "右欄拼音或意思": "", "題目說明": "「謝謝」是什麼意思？", "選項(逗號分開)": "Hello, Thank you, Goodbye", "正確答案": "Thank you" }
    ];

    var ws = XLSX.utils.json_to_sheet(templateData);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "題庫範本");
    XLSX.writeFile(wb, "生詞練習台_題庫範本.xlsx");
  };

  document.getElementById("btn-export-excel").onclick = function(){
    var currentSets = getSets();
    var exportRows = [];

    Object.keys(currentSets).forEach(function(sid){
      var s = currentSets[sid];
      if(s.type === "match" && s.pairs){
        Object.keys(s.pairs).forEach(function(pid){
          exportRows.push({
            "題型": "match",
            "題目名稱": s.title,
            "左欄生詞": s.pairs[pid].left,
            "右欄拼音或意思": s.pairs[pid].right,
            "題目說明": "",
            "選項(逗號分開)": "",
            "正確答案": ""
          });
        });
      } else if(s.type === "circle" && s.choices){
        var cTexts = Object.keys(s.choices).map(function(cid){ return s.choices[cid].text; }).join(", ");
        var ansText = s.correctIds && s.correctIds.length ? (s.choices[s.correctIds[0]] ? s.choices[s.correctIds[0]].text : "") : "";
        exportRows.push({
          "題型": "circle",
          "題目名稱": s.title,
          "左欄生詞": "",
          "右欄拼音或意思": "",
          "題目說明": s.prompt || "",
          "選項(逗號分開)": cTexts,
          "正確答案": ansText
        });
      }
    });

    if(exportRows.length === 0){
      alert("目前沒有可匯出的連連看或選擇題。");
      return;
    }

    var ws = XLSX.utils.json_to_sheet(exportRows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "題庫備份");
    XLSX.writeFile(wb, "生詞題庫備份_" + new Date().toISOString().slice(0,10) + ".xlsx");
  };

  renderTopbar(); renderSidebar();
  if(urlRoom){
    window.addEventListener("firebase-bridge-ready", function(){
      attachPresence(urlRoom, roomRole);
      startRoom(urlRoom, roomRole);
    });
  } else {
    renderStage();
  }
})();
</script>
